<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F1F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bio Cards">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Bio Cards · Slide 07–13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
:root{
  --bg:#F2F1F6;--surface:#fff;--ink:#1C1A2B;--muted:#5D5972;--line:#DBD7E5;--acc:#46378C;--accbg:#EEEBFA;
  --ok:#2E7D4F;--okbg:#E6F4EC;--bad:#C2364B;--badbg:#FBE9EC;--c:#46378C;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 "IBM Plex Sans Thai",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
h1,h2,h3{font-family:Anuphan,sans-serif;margin:0;line-height:1.3}
[hidden]{display:none!important}
mark{background:#FFE9A8;color:inherit;border-radius:3px;padding:0 2px}
.btn{border:0;border-radius:14px;padding:12px 20px;font:600 17px/1.2 Anuphan,sans-serif;cursor:pointer;background:var(--acc);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}
.btn.no{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}
.btn.yes{background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:15px;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.chip .k{opacity:.7;font-size:13px;margin-left:4px}
.link{border:0;background:none;color:var(--acc);font-weight:600;cursor:pointer;padding:2px 0;font-size:14.5px}

/* full-height screens: nothing scrolls except the middle area, and only if it must */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.screen>.mid{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.topbar{flex:none;background:#fff;border-bottom:1px solid var(--line);padding:calc(var(--sat) + 4px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 4px)}
.tbrow{display:flex;align-items:center;gap:6px;max-width:1100px;margin:0 auto;min-height:46px}
.bk{flex:none;width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--acc)}
.bk:active{background:var(--accbg)}
.tbt{flex:1;min-width:0}
.tbt b{display:block;font:600 15px/1.25 Anuphan,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbt small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.tbs{flex:none;display:flex;gap:5px;align-items:center}
.pill{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:999px;padding:5px 10px;font:600 14px/1.2 "IBM Plex Mono",monospace;white-space:nowrap}
.pill.life{color:var(--bad);letter-spacing:1px}
.pill.ok{color:var(--ok)}.pill.no{color:var(--bad)}
.tbtn{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font:600 13.5px/1.2 Anuphan,sans-serif;color:var(--muted);cursor:pointer}
.prog{height:4px;background:#ECEAF2;margin:4px calc(-1 * (var(--sar) + 10px)) 0 calc(-1 * (var(--sal) + 4px))}
.prog i{display:block;height:100%;width:0;background:var(--c);transition:width .35s}
.botbar{flex:none;background:#fff;border-top:1px solid var(--line);padding:10px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px)}
.botbar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
.botbar .grow{flex:1;display:flex;gap:8px;min-width:0}
.botbar .grow .btn{flex:1;height:54px;padding:0 10px;border-radius:16px}
.nav{flex:none;width:54px;height:54px;border-radius:16px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--acc)}
.nav:disabled{color:#C9C5D6;cursor:not-allowed}

/* ---------- HOME ---------- */
#home{max-width:720px;margin:0 auto;padding:calc(var(--sat) + 12px) calc(var(--sar) + 14px) calc(var(--sab) + 18px) calc(var(--sal) + 14px)}
.hhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.hhead h1{font-size:23px}
.hhead span{color:var(--muted);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#E6E3EE;border-radius:15px}
.seg button{border:0;background:transparent;border-radius:11px;padding:10px 6px;font:600 16.5px/1.2 Anuphan,sans-serif;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--acc);box-shadow:0 1px 4px rgba(40,30,90,.14)}
.setline{display:flex;width:100%;align-items:center;gap:8px;margin-top:8px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 12px;cursor:pointer;text-align:left;font-size:14.5px}
.setline .sv{flex:1;min-width:0}
.setline .sv b{font-weight:600}
.setline .chev{color:var(--muted);transition:transform .2s}
.setline[aria-expanded="true"] .chev{transform:rotate(180deg)}
.setpanel{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 13px 13px;margin-top:-6px;padding:14px 12px 12px}
.opt+.opt{margin-top:12px}
.opt .lb{font:600 14px/1.3 Anuphan,sans-serif;margin:0 0 7px}
.opt .ds{font-size:13px;color:var(--muted);margin:7px 0 0;line-height:1.5}
.resume{display:flex;align-items:center;gap:11px;width:100%;margin-top:8px;border:0;border-radius:14px;padding:11px 14px;background:var(--acc);color:#fff;cursor:pointer;text-align:left}
.resume .ic{flex:none;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.resume b{display:block;font:600 16px/1.25 Anuphan,sans-serif}
.resume small{display:block;font-size:13px;opacity:.88;line-height:1.3}
.resume .go{margin-left:auto;font:600 22px/1 Anuphan,sans-serif}
.lsh{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 8px}
.lsh h2{font-size:15px;color:var(--muted)}
.lsh span{font-size:12.5px;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{--tc:var(--acc);display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:15px;padding:10px 11px;cursor:pointer;min-height:82px}
.tile:active{background:#F6F5FA}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}
.tile .top{display:flex;align-items:center;gap:8px;width:100%}
.tno{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--tc);color:#fff;font:600 14px/1 "IBM Plex Mono",monospace}
.tname{font:600 15px/1.25 Anuphan,sans-serif;overflow-wrap:anywhere}
.tmeta{display:flex;align-items:center;gap:7px;width:100%;font-size:12.5px;color:var(--tc);font-weight:600}
.tile.wide .tmeta{width:auto;margin-left:auto}
.tmeta .pb{flex:1;height:5px;border-radius:9px;background:#ECEAF2;overflow:hidden;min-width:30px}
.tmeta .pb i{display:block;height:100%;background:var(--tc)}
.pickbtn{display:block;width:100%;margin-top:10px;border:1px dashed var(--line);background:none;border-radius:13px;padding:10px;color:var(--acc);font:600 14.5px/1.3 Anuphan,sans-serif;cursor:pointer}

/* ---------- SECTION PICKER ---------- */
.pickin{max-width:720px;margin:0 auto;padding:14px calc(var(--sar) + 14px) 14px calc(var(--sal) + 14px)}
.pickin h3{font-size:14px;color:var(--muted);margin:0 0 8px}
.pickin .blk+.blk{margin-top:16px}
.pickin .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* ---------- MATCH ---------- */
.gin{max-width:1100px;margin:0 auto;padding:10px calc(var(--sar) + 12px) 12px calc(var(--sal) + 12px)}
/* phone */
.qbox{background:#fff;border:1.5px solid var(--acc);border-radius:16px;padding:10px 13px 12px}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.qhead .qn{font:600 12.5px/1.2 Anuphan,sans-serif;color:var(--acc);margin-right:auto}
.qdots{display:flex;gap:5px}
.qd{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font:600 13px/1 "IBM Plex Mono",monospace;cursor:pointer;color:var(--muted);padding:0}
.qd.cur{border-color:var(--acc);background:var(--acc);color:#fff}
.qd.done{border-color:#9BD0B1;background:var(--okbg);color:var(--ok)}
.qt{font:600 17px/1.5 Anuphan,sans-serif;overflow-wrap:anywhere}
.mfb{min-height:21px;margin:7px 2px 8px;font:600 13.5px/1.4 Anuphan,sans-serif;color:var(--muted);overflow-wrap:anywhere}
.mfb.ok{color:var(--ok)}.mfb.bad{color:var(--bad)}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acard{display:flex;align-items:center;text-align:left;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:9px 11px;cursor:pointer;font-size:15px;line-height:1.4;font-weight:500;overflow-wrap:anywhere;min-height:62px}
.acard:active{background:var(--accbg)}
.acard.bad{border-color:var(--bad);background:var(--badbg);animation:shake .38s}
.acard.decoy{background:#F6F5F9;border-style:dashed;color:var(--muted);cursor:default;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px}
.dl{display:inline-block;font:600 12px/1.2 Anuphan,sans-serif;color:var(--bad);background:var(--badbg);border-radius:99px;padding:2px 8px}
/* tablet / desktop */
.fb{margin:0 0 12px;min-height:54px;border-radius:14px;padding:10px 14px;background:#fff;border:1px solid var(--line);font-size:15.5px;line-height:1.55;color:var(--muted)}
.fb.ok{background:var(--okbg);border-color:#BFE0CC;color:var(--ink)}
.fb.bad{background:var(--badbg);border-color:#F1C4CC;color:var(--ink)}
.fb .h{font:700 15.5px/1.4 Anuphan,sans-serif;margin-right:6px}
.fb.ok .h{color:var(--ok)}.fb.bad .h{color:var(--bad)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.colh{font:600 14px/1.3 Anuphan,sans-serif;color:var(--muted);margin:0 0 8px 4px}
.col{display:flex;flex-direction:column;gap:9px}
.card{position:relative;text-align:left;width:100%;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:11px 14px;cursor:pointer;line-height:1.5;overflow-wrap:anywhere}
.card .tx{display:block;font-size:16.5px}
.card.a .tx{font-weight:500}
.card .tag{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:3px;line-height:1.3}
.card .tag i{flex:none;width:8px;height:8px;border-radius:99px}
.card.sel{border-color:var(--acc);background:var(--accbg);box-shadow:0 0 0 2px var(--acc) inset}
.card.ok{border-color:#9BD0B1;background:var(--okbg);cursor:default;padding-right:46px}
.card.ok .tx{color:#24402F}
.card .badge{position:absolute;top:10px;right:10px;display:grid;place-items:center;width:28px;height:28px;border-radius:99px;background:var(--ok);color:#fff;font:600 13px/1 "IBM Plex Mono",monospace}
.card.bad{border-color:var(--bad);background:var(--badbg);animation:shake .38s}
.card.decoy{background:#F6F5F9;border-style:dashed;cursor:default}
.card.decoy .tx{color:var(--muted)}
.card .dl{margin-top:6px}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* ---------- FLASH ---------- */
.fcmain{flex:1;min-height:0;display:flex;padding:12px calc(var(--sar) + 12px) 12px calc(var(--sal) + 12px)}
.fcard{flex:1;max-width:760px;margin:0 auto;display:flex;min-height:0;cursor:pointer;perspective:1400px;outline:none}
.fcard:focus-visible .face{outline:3px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:3px}
.face{flex:1;min-height:0;overflow-y:auto;background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:18px 18px 20px;display:flex;flex-direction:column;box-shadow:0 6px 24px -16px rgba(40,30,90,.4);-webkit-overflow-scrolling:touch}
.face.back{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.face.anim{animation:flipin .28s ease-out}
@keyframes flipin{from{transform:rotateY(80deg);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.face.anim,.acard.bad,.card.bad{animation:none}.prog i{transition:none}}
.fh{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:10px}
.fh .sec{display:flex;align-items:center;gap:7px;min-width:0}
.fh .sec i{flex:none;width:9px;height:9px;border-radius:99px;background:var(--c)}
.side{flex:none;font:600 12.5px/1 Anuphan,sans-serif;padding:5px 9px;border-radius:99px;background:var(--bg);color:var(--muted)}
.face.back .side{background:var(--okbg);color:var(--ok)}
.fq{flex:1;display:flex;align-items:center;font:600 21px/1.5 Anuphan,sans-serif;overflow-wrap:anywhere}
.tip{flex:none;font-size:13px;color:var(--muted);margin-top:12px;text-align:center}
.bq{font-size:14px;color:var(--muted);line-height:1.5;padding-bottom:9px;border-bottom:1px dashed var(--line);overflow-wrap:anywhere}
.ba{font:700 22px/1.4 Anuphan,sans-serif;color:var(--ok);margin:10px 0 5px;overflow-wrap:anywhere}
.be{font-size:15.5px;line-height:1.6;overflow-wrap:anywhere}
.trick{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:14px;background:#FFF7E0;border:1px solid #F0DBA0;font-size:15px;line-height:1.55;color:#4A3A10;overflow-wrap:anywhere}
.trick .ti{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:#F6C744}
.trick b{display:block;font:700 12.5px/1.3 Anuphan,sans-serif;color:#8A6410;margin-bottom:1px}

/* ---------- SUMMARY ---------- */
.sum{max-width:860px;margin:0 auto;padding:calc(var(--sat) + 14px) calc(var(--sar) + 14px) calc(var(--sab) + 24px) calc(var(--sal) + 14px)}
.sumcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.sumcard h2{font-size:23px}
.sub{color:var(--muted);margin:3px 0 0;font-size:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.big{background:var(--bg);border-radius:13px;padding:9px;text-align:center}
.big span{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.big b{font:600 22px/1.3 "IBM Plex Mono",monospace}
.best{font-size:14px;color:#C27A12;font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rv{margin-top:16px}
.rv h3{font-size:16px;margin:0 2px 8px}
.rvi{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff;font-size:15px}
.rvi.good{border-left-color:var(--ok)}
.rvi .q{font-weight:600}
.rvi .a{color:var(--ok);font-weight:600;margin-top:3px}
.rvi .e{color:var(--muted);font-size:14px;margin-top:4px}
.rvi .m{margin-top:6px;font-size:14px;color:#5C4810;background:#FFF7E0;border-radius:8px;padding:6px 10px}
.rvi .m b{color:#8A6410;margin-right:4px}
.rvi .s{font-size:12px;color:var(--muted)}

@media (max-width:759px){
  .board,.fb{display:none}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .acts .btn{flex:1 1 100%}
}
@media (min-width:760px){
  #mphone{display:none}
  body{font-size:17px}
  .hhead h1{font-size:28px}
  .tgrid{grid-template-columns:1fr 1fr 1fr}
  .tile{min-height:96px;padding:12px 13px}
  .tname{font-size:16px}
  .fcard{max-height:640px;align-self:center;height:100%}
  .fq{font-size:24px}
}
@media (max-width:370px){.pill.hide-xs{display:none}.acard{font-size:14px}.qt{font-size:16px}}
</style>
</head>
<body>

<!-- ===== HOME ===== -->
<main id="home">
  <div class="hhead"><h1>Bio Cards</h1><span>Slide 07–13</span></div>
  <div class="seg" role="group" aria-label="โหมด">
    <button type="button" data-m="match"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="7" height="5" rx="1.5"/><rect x="2.5" y="15" width="7" height="5" rx="1.5"/><rect x="14.5" y="4" width="7" height="5" rx="1.5"/><rect x="14.5" y="15" width="7" height="5" rx="1.5"/><path d="M9.5 6.5 14.5 17.5M9.5 17.5l5-11"/></svg>จับคู่</button>
    <button type="button" data-m="flash"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 6V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg>Flash cards</button>
  </div>
  <button type="button" class="setline" id="setBtn" aria-expanded="false" aria-controls="setPanel">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--muted)"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    <span class="sv" id="setSum"></span>
    <svg class="chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div class="setpanel" id="setPanel" hidden></div>
  <button type="button" class="resume" id="resume" hidden>
    <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg></span>
    <span><b>เล่นต่อ</b><small id="resumeSub"></small></span>
    <span class="go">›</span>
  </button>
  <div class="lsh"><h2>เลือกบท</h2><span>แตะเพื่อเริ่มเลย</span></div>
  <div class="tgrid" id="tgrid"></div>
  <button type="button" class="pickbtn" id="pickBtn">เลือกเฉพาะหัวข้อย่อย ›</button>
</main>

<!-- ===== SECTION PICKER ===== -->
<section id="pick" class="screen" hidden>
  <header class="topbar"><div class="tbrow">
    <button type="button" class="bk" id="pBack" aria-label="กลับ"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="tbt"><b>เลือกหัวข้อย่อย</b><small id="pSub"></small></div>
  </div></header>
  <div class="mid"><div class="pickin">
    <div class="blk"><h3>บท</h3><div class="chips" id="pTopics"></div></div>
    <div class="blk"><div class="row"><h3>หัวข้อย่อย</h3><button type="button" class="link" id="pAll"></button></div><div class="chips" id="pSecs"></div></div>
  </div></div>
  <div class="botbar"><div class="in"><div class="grow"><button type="button" class="btn" id="pGo"></button></div></div></div>

/* ---------- text comparison helpers ---------- */
const toks=s=>s.toLowerCase().replace(/[()·,.:;'"“”‘’\-–—→+]/g," ").split(/\s+/).filter(Boolean);
const core=s=>s.replace(/\([^)]*\)/g," ");
function hasSeq(a,b){if(!b.length||b.length>a.length)return false;outer:for(let i=0;i<=a.length-b.length;i++){for(let j=0;j<b.length;j++)if(a[i+j]!==b[j])continue outer;return true}return false}
function clash(x,y){
  const a=toks(x),b=toks(y),ca=toks(core(x)),cb=toks(core(y));
  return hasSeq(a,b)||hasSeq(b,a)||(ca.length&&cb.length&&(hasSeq(ca,cb)||hasSeq(cb,ca)));
}
const isNum=s=>/\d/.test(s)&&/^[\d\s.,:/%×x+\-−–~≈<>=]+[a-zA-Zก-๙ ]{0,14}$/.test(s.trim());

/* ---------- MATCH ---------- */
let deck=null,R=null,timer=null;
function compatible(it,chosen){
  for(const c of chosen){if(clash(c.a,it.a)||c.q===it.q)return false}
  if(isNum(it.a)&&chosen.filter(c=>isNum(c.a)).length>=2)return false;
  return true;
}
function drawRound(n){
  const free=deck.items.filter(it=>!deck.used.has(it.id));
  if(!free.length)return [];
  const seed=free[0],chosen=[seed];
  const tiers=[
    free.filter(x=>x!==seed&&x.tp===seed.tp&&x.s===seed.s),
    free.filter(x=>x!==seed&&x.tp===seed.tp&&x.s!==seed.s),
    free.filter(x=>x.tp!==seed.tp)
  ];
  for(const tier of tiers)for(const it of tier){if(chosen.length>=n)break;if(compatible(it,chosen))chosen.push(it)}
  return chosen;
}
function pickDecoys(items,k){
  const out=[],answers=items.map(x=>x.a);
  const pools=shuffle(items).map(it=>shuffle(it.x||[]));
  let progress=true;
  while(out.length<k&&progress){
    progress=false;
    for(const pl of pools){
      if(out.length>=k)break;
      while(pl.length){const d=pl.shift();if(answers.some(a=>clash(a,d))||out.some(o=>clash(o,d)))continue;out.push(d);progress=true;break}
    }
  }
  return out;
}
function startMatch(items,topic,label,retry){
  deck={items:shuffle(items),used:new Set(),label,missedAll:new Map(),round:0,total:items.length,score:0,topic,retry:!!retry,level:selLevel,pass:1};
  nextRound();
}
function nextRound(){
  let items=drawRound(selSize);
  if(items.length<Math.min(3,deck.total)){deck.used.clear();deck.items=shuffle(deck.items);deck.pass++;items=drawRound(selSize)}
  items.forEach(it=>deck.used.add(it.id));
  deck.round++;
  const L=LEVELS[deck.level];
  const decoys=pickDecoys(items,L.decoy(items.length));
  const qOrder=shuffle(items);
  R={items,decoys,qOrder,
     ans:shuffle(items.map(it=>({id:it.id,t:it.a})).concat(decoys.map((d,i)=>({id:"decoy-"+i,t:d})))),
     matched:new Set(),order:new Map(),cur:qOrder[0].id,sel:null,miss:0,streak:0,maxStreak:0,score:0,t0:0,elapsed:0,
     missed:new Map(),busy:false,end:null,lives:L.lives,fb:null};
  show("game");
  document.documentElement.style.setProperty("--c",topicOf(deck.topic).c);
  $("gTitle").textContent=deck.label;
  $("gSub").textContent="รอบ "+deck.round+" · "+L.name+" · ผ่านแล้ว "+Math.min(deck.used.size,deck.total)+"/"+deck.total;
  $("sLife").hidden=!L.lives;
  clearInterval(timer);timer=null;
  renderMatch();
}
function startClock(){
  if(timer)return;
  R.t0=performance.now()-R.elapsed*1000;
  timer=setInterval(()=>{R.elapsed=(performance.now()-R.t0)/1000},500);
}
function renderMatch(){
  $("sPair").textContent=R.matched.size+"/"+R.items.length;
  $("sScore").textContent=R.score;
  const L=LEVELS[deck.level];
  $("sLife").textContent="♥".repeat(Math.max(0,R.lives))+"♡".repeat(Math.max(0,L.lives-R.lives));
  $("gBar").style.width=(R.items.length?R.matched.size/R.items.length*100:0)+"%";
  if(isPhone())renderPhone();else renderDesk();
}
function renderDesk(){
  const f=$("fb"),fb=R.fb;
  if(!fb){f.className="fb";f.textContent="แตะคำถามทางซ้าย แล้วแตะคำตอบทางขวาที่คู่กัน ฝั่งคำตอบมีตัวหลอก "+R.decoys.length+" ใบ"}

    if(R.end)b.disabled=true;

  });
  R.ans.forEach(o=>{
    const b=document.createElement("button");b.type="button";b.className="card a";b.dataset.id=o.id;
    const done=R.matched.has(o.id),dec=o.id.startsWith("decoy-");
    if(done){b.classList.add("ok");b.disabled=true}
    if(R.sel&&R.sel.side==="a"&&R.sel.id===o.id)b.classList.add("sel");
    if(R.end){b.disabled=true;if(dec)b.classList.add("decoy")}
    b.innerHTML='<span class="tx">'+esc(o.t)+'</span>'+(done?'<span class="badge">'+R.order.get(o.id)+'</span>':"")+(R.end&&dec?'<span class="dl">ตัวหลอก</span>':"");
    b.onclick=()=>deskTap("a",o.id);ca.appendChild(b);
  });
}
function deskTap(side,id){
  if(R.busy||R.end||R.matched.has(id))return;
  startClock();
  if(!R.sel||R.sel.side===side){R.sel=(R.sel&&R.sel.id===id)?null:{side,id};renderMatch();return}
  const qid=side==="q"?id:R.sel.id,aid=side==="a"?id:R.sel.id;
  R.sel=null;check(qid,aid);
}
function renderPhone(){
  const dots=$("qdots");dots.innerHTML="";

    else b.textContent=o.t;

    b.onclick=()=>{if(R.busy||R.end)return;startClock();check(R.cur,o.id)};

function check(qid,aid){
  const it=BYID.get(qid),L=LEVELS[deck.level];
  if(qid===aid){
    R.matched.add(qid);R.order.set(qid,R.order.size+1);R.streak++;R.maxStreak=Math.max(R.maxStreak,R.streak);
    const gain=100+10*Math.min(R.streak-1,10);R.score+=gain;
    R.fb={kind:"ok",head:"✓ ถูกต้อง +"+gain,short:"✓ ถูก +"+gain+" · "+it.a,body:it.e?rich(it.e):esc(it.a)};
    const nq=R.qOrder.find(x=>!R.matched.has(x.id));if(nq)R.cur=nq.id;
    renderMatch();
    if(R.matched.size===R.items.length)endMatch("win");
  }else{
    R.miss++;R.streak=0;R.score=Math.max(0,R.score-L.penalty);
    R.missed.set(qid,it);
    const other=BYID.get(aid);if(other&&R.items.includes(other))R.missed.set(other.id,other);
    if(L.lives)R.lives--;
    const note=L.lives?(R.lives>0?"เหลือ "+R.lives+" ชีวิต":"ชีวิตหมด"):"ลองใหม่";
    R.fb={kind:"bad",head:"✗ ยังไม่ใช่ −"+L.penalty,short:"✗ ยังไม่ใช่ −"+L.penalty+" · "+note,body:note};
    renderMatch();
    R.busy=true;
    const sel=isPhone()?['#agrid [data-id="'+aid+'"]']:['#colQ [data-id="'+qid+'"]','#colA [data-id="'+aid+'"]'];
    const els=sel.map(s=>document.querySelector(s)).filter(Boolean);
    els.forEach(x=>x.classList.add("bad"));
    setTimeout(()=>{els.forEach(x=>x.classList.remove("bad"));R.busy=false;if(L.lives&&R.lives<=0)endMatch("dead")},520);
  }
}
function endMatch(kind){
  if(R.end)return;R.end=kind;
  clearInterval(timer);timer=null;
  if(R.t0)R.elapsed=(performance.now()-R.t0)/1000;
  renderMatch();
  setTimeout(()=>matchSummary(kind),kind==="win"?800:250);
}

function addBtn(box,t,cls,fn){const b=document.createElement("button");b.type="button";b.className="btn"+(cls?" "+cls:"");b.textContent=t;b.onclick=fn;box.appendChild(b);return b}
function matchSummary(kind){

let F=null;
function startFlash(items,topic,label){
  const ordered=selOrder==="seq"?items.slice():shuffle(items);
  F={queue:ordered,total:items.length,yes:new Set(),no:new Map(),status:new Map(),hist:[],hpos:-1,topic,label,flipped:false,cur:null};
  show("flash");

}
function drawCard(){
  if(!F.queue.length)return flashSummary();
  const it=F.queue.shift();
  F.hist.push(it);F.hpos=F.hist.length-1;
  showCard(it);
}
function showCard(it){
  F.cur=it;F.flipped=false;
  const sec=(F.topic==="mix"?"Slide "+it.tp+" · ":"")+it.s;
  $("fSec").textContent=sec;$("fSec2").textContent=sec;

  $("fM").textContent=it.m||"";$("fTrick").hidden=!it.m;

function showFace(back,anim){

const atLive=()=>F.hpos===F.hist.length-1;
const canNext=()=>!atLive()||F.queue.length>0;
function updFlash(){
  $("fYes").textContent="✓ "+F.yes.size;$("fNoCnt").textContent="✗ "+F.no.size;
  $("fBar").style.width=(F.total?F.yes.size/F.total*100:0)+"%";
  const live=F.hist[F.hist.length-1],rem=F.queue.length+(live&&!F.status.has(live.id)?1:0);
  const st=F.cur&&F.status.get(F.cur.id);
  $("fSub").textContent=(!atLive()?"ดูย้อนหลัง"+(st?" · ให้ไว้ว่า"+(st==="yes"?"จำได้":"ยังไม่แม่น"):""):"ใบที่ "+(F.hpos+1))+" · เหลือ "+rem+" ใบ";
  $("bPrev").disabled=F.hpos<=0;
  $("bNext").disabled=!canNext();
}
function flipCard(){
  if(!F||!F.cur)return;
  F.flipped=!F.flipped;
  showFace(F.flipped,true);
}
function goPrev(){if(!F||F.hpos<=0)return;F.hpos--;showCard(F.hist[F.hpos])}
function goNext(){
  if(!F||!canNext())return;
  if(!atLive()){F.hpos++;showCard(F.hist[F.hpos]);return}
  const it=F.cur;
  if(!F.status.has(it.id)&&!F.queue.includes(it))F.queue.push(it);
  drawCard();
}
function rate(ok){
  if(!F||!F.cur||!F.flipped)return;
  const it=F.cur;
  F.status.set(it.id,ok?"yes":"no");
  if(ok){F.yes.add(it.id);known.add(it.id);saveKnown();F.queue=F.queue.filter(x=>x!==it)}
  else{
    F.yes.delete(it.id);F.no.set(it.id,it);known.delete(it.id);saveKnown();
    if(!F.queue.includes(it))F.queue.splice(Math.min(F.queue.length,4+Math.floor(Math.random()*3)),0,it);
  }
  if(!atLive()){F.hpos++;showCard(F.hist[F.hpos]);return}
  drawCard();
}
function flashSummary(){
  show("summary");
  $("rTitle").textContent="ทบทวนครบทุกใบแล้ว";
  $("rSub").textContent=F.label+" · "+F.total+" ใบ";
  const hard=[...F.no.values()];
  $("rGrid").innerHTML=[["การ์ดทั้งหมด",F.total],["จำได้รอบแรก",F.total-hard.length],["ต้องวนกลับมา",hard.length],["จำได้ทั้งบท",ALL.filter(x=>(F.topic==="mix"||x.tp===F.topic)&&known.has(x.id)).length]].map(([a,b])=>'<div class="big"><span>'+a+'</span><b>'+b+'</b></div>').join("");
  $("rBest").textContent="";
  const acts=$("rActs");acts.innerHTML="";
  const base=F.label.replace(/ · (ใบที่เคยพลาด|ข้อที่พลาด)$/,"");
  if(hard.length){
    addBtn(acts,"ทบทวนใบที่เคยพลาด ("+hard.length+")","",()=>startFlash(hard,F.topic,base+" · ใบที่เคยพลาด"));
    const mb=addBtn(acts,"เอาใบที่พลาดไปเล่นจับคู่","ghost",()=>{if(hard.length>=3)startMatch(hard,F.topic,base+" · ข้อที่พลาด",true)});
    mb.disabled=hard.length<3;
  }
  addBtn(acts,"หน้าแรก",hard.length?"ghost":"",toHome);
  $("rv").innerHTML=hard.length?'<h3>การ์ดที่ต้องวนกลับมาทบทวน</h3>'+hard.map(x=>rvItem(x,F.topic==="mix",false)).join(""):"";
}
(function(){
  const fc=$("fcard");let sx=0,sy=0,swiped=false;
  fc.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;swiped=false},{passive:true});
  fc.addEventListener("touchend",e=>{
    const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dy)<45){swiped=true;if(dx<0)goNext();else goPrev()}
  },{passive:true});
  fc.addEventListener("click",()=>{if(swiped){swiped=false;return}flipCard()});
})();
$("bFlip").onclick=flipCard;
$("bYes").onclick=()=>rate(true);
$("bNo").onclick=()=>rate(false);
$("bPrev").onclick=goPrev;
$("bNext").onclick=goNext;
document.addEventListener("keydown",e=>{
  if($("flash").hidden||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="Enter"&&e.target.closest&&e.target.closest("button"))return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();flipCard()}
  else if(e.key==="ArrowRight"){e.preventDefault();goNext()}
  else if(e.key==="ArrowLeft"){e.preventDefault();goPrev()}
  else if(e.key==="1"){e.preventDefault();rate(false)}
  else if(e.key==="2"){e.preventDefault();rate(true)}
});

/* ---------- NAV ---------- */
function show(v){["home","pick","game","flash","summary"].forEach(x=>$(x).hidden=x!==v);window.scrollTo({top:0})}
function toHome(){clearInterval(timer);timer=null;show("home");renderHome()}
$("gBack").onclick=toHome;$("fBack").onclick=toHome;
$("skip").onclick=()=>{if(R&&!R.end)endMatch("give")};
renderHome();
})();
</script>
