<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--PWA-HEAD-->
<title>Bio Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
:root{
  --bg:#F6F4F0;--card:#fff;--ink:#1F1B24;--muted:#6E6876;--faint:#A29CA8;--line:#E8E3DC;
  --acc:#E8613C;--acc2:#FF8A5B;--accbg:#FDEDE6;
  --ok:#2C9C69;--okbg:#E5F5EC;--bad:#DD4B5A;--badbg:#FCE9EB;--c:#E8613C;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --spring:cubic-bezier(.2,.9,.25,1.25);--ease:cubic-bezier(.25,.8,.25,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body{font:16px/1.5 "IBM Plex Sans Thai",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 40%,transparent);outline-offset:2px}
h1,h2,h3{font-family:Anuphan,sans-serif;margin:0;line-height:1.3}
[hidden]{display:none!important}
mark{background:#FFE7A3;color:inherit;border-radius:4px;padding:0 2px}
.press{transition:transform .18s var(--spring)}
.press:active{transform:scale(.965)}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.screen.enter{animation:enter .38s var(--spring)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mid{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.col{max-width:640px;margin:0 auto;padding:0 calc(var(--sar) + 18px) 0 calc(var(--sal) + 18px)}

/* ---------- HOME ---------- */
#home .mid{padding-top:calc(var(--sat) + 10px);padding-bottom:calc(var(--sab) + 20px)}
.hbar{display:flex;align-items:center;justify-content:space-between;height:44px}
.brand{font:700 17px/1 Anuphan,sans-serif;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--acc2),var(--acc));display:block}
.hright{display:flex;align-items:center;gap:6px}
.streak{display:flex;align-items:center;gap:4px;height:34px;padding:0 12px;border-radius:99px;background:#fff;border:1px solid var(--line);font:600 15px/1 "IBM Plex Mono",monospace;color:var(--acc)}
.streak svg{transform-origin:50% 90%;animation:flick 2.4s ease-in-out infinite}
.streak.off{color:var(--faint)}.streak.off svg{animation:none}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.08) rotate(-4deg)}60%{transform:scale(.96) rotate(3deg)}}
.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.icon:active{background:#EEEAE4}
.greet{font-size:25px;margin:8px 0 14px}
.date{color:var(--muted);margin:0 0 16px;font-size:14.5px}
.hero{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border-radius:20px;color:#fff;background:linear-gradient(135deg,var(--acc2) 0%,var(--acc) 70%);box-shadow:0 10px 22px -14px rgba(232,97,60,.75);overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-40px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .ht{flex:1;min-width:0;position:relative;z-index:1}
.hero .hl{display:block;font:700 18.5px/1.25 Anuphan,sans-serif}
.hero .hs{display:block;font-size:13.5px;opacity:.92;margin-top:1px;line-height:1.35}
.hero .play{flex:none;width:42px;height:42px;border-radius:99px;background:#fff;color:var(--acc);display:grid;place-items:center;position:relative;z-index:1}
.hero .play svg{margin-left:2px}
.hero .go{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#fff;color:var(--acc);font:700 15.5px/1 Anuphan,sans-serif;padding:10px 16px;border-radius:99px}
.ring{position:relative;flex:none;width:56px;height:56px;z-index:1}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:600 14px/1 "IBM Plex Mono",monospace}
.ring .rv small{display:block;font:600 10px/1.2 "IBM Plex Mono",monospace;opacity:.85;margin-top:1px}
.ring circle{transition:stroke-dashoffset .9s var(--ease)}
.lsh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 2px 10px}
.mseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:18px;background:#ECE8E2;margin:18px 0 12px}
.mseg button{padding:13px 6px;border-radius:14px;font:700 16.5px/1.2 Anuphan,sans-serif;color:var(--muted);transition:background .2s,color .2s}
.mseg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.chap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch{display:grid;grid-template-columns:38px 1fr;column-gap:10px;align-items:center;text-align:left;padding:11px 12px;border-radius:18px;background:#fff;border:1px solid var(--line);min-height:66px}
.ch .no{grid-row:1/3;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--tc);color:#fff;font:600 13.5px/1 "IBM Plex Mono",monospace}
.ch b{font:600 14.5px/1.25 Anuphan,sans-serif;overflow-wrap:anywhere}
.ch .mbar{height:5px;margin-top:6px}
.lsh h2{font-size:15px;color:var(--muted);font-weight:600}
.subj{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subj.one{grid-template-columns:1fr}
.subj.one .stile{display:grid;grid-template-columns:44px 1fr;column-gap:14px;row-gap:3px;align-items:center;min-height:0;padding:16px 18px}
.subj.one .stile .si{grid-row:1/4}
.subj.one .stile small{margin-top:0}
.subj.one .stile .mbar{margin-top:6px}
.stile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:16px;border-radius:22px;background:#fff;border:1px solid var(--line);min-height:150px}
.stile .si{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.stile b{font:700 18px/1.25 Anuphan,sans-serif}
.stile small{color:var(--muted);font-size:13.5px;line-height:1.35;margin-top:-6px}
.mbar{width:100%;height:6px;border-radius:9px;background:#F0ECE6;overflow:hidden;margin-top:auto}
.mbar i{display:block;height:100%;border-radius:9px;background:var(--tc,var(--acc));transition:width .8s var(--ease)}
.cont{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:13px 16px;border-radius:18px;background:#fff;border:1px solid var(--line);text-align:left}
.cont .cd{width:10px;height:10px;border-radius:99px;flex:none}
.cont span{flex:1;min-width:0;font-size:14.5px;line-height:1.35}
.cont span b{font-weight:600}
.cont em{font-style:normal;color:var(--acc);font:700 18px/1 Anuphan,sans-serif}

/* ---------- SHEET ---------- */
.scrim{position:fixed;inset:0;background:rgba(31,27,36,.32);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:86dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .42s var(--spring);box-shadow:0 -10px 40px -20px rgba(0,0,0,.35);z-index:30}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:#D6D0C8;margin:10px auto 4px;flex:none}
.shhead{flex:none;padding:6px calc(var(--sar) + 18px) 10px calc(var(--sal) + 18px);max-width:640px;width:100%;margin:0 auto}
.shhead h2{font-size:21px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;border-radius:14px;background:#ECE8E2;margin-top:12px}
.seg button{padding:9px 4px;border-radius:11px;font:600 14.5px/1.2 Anuphan,sans-serif;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.segnote{font-size:12.5px;color:var(--muted);margin:7px 2px 0;line-height:1.4}
.shbody{flex:1;min-height:0;overflow-y:auto;padding:4px calc(var(--sar) + 18px) calc(var(--sab) + 18px) calc(var(--sal) + 18px);max-width:640px;width:100%;margin:0 auto}
.drow{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:8px;overflow:hidden}
.drow .main{display:flex;align-items:stretch}
.dgo{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 6px 12px 12px;text-align:left}
.dno{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--tc);color:#fff;font:600 13.5px/1 "IBM Plex Mono",monospace}
.dinfo{flex:1;min-width:0}
.dinfo b{display:block;font:600 16px/1.3 Anuphan,sans-serif}
.dinfo small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:1px}
.dinfo .mbar{margin-top:7px;height:5px}
.dsec{flex:none;width:52px;border-left:1px solid var(--line);color:var(--faint);display:grid;place-items:center}
.drow.open .dsec{color:var(--acc)}
.drow.open .dsec svg{transform:rotate(180deg)}
.dsec svg{transition:transform .25s var(--ease)}
.secs{border-top:1px solid var(--line);padding:12px;background:#FCFBF9}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:14.5px;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .k{opacity:.6;font-size:12.5px;margin-left:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:14px 20px;font:700 16.5px/1.2 Anuphan,sans-serif;background:var(--ink);color:#fff}
.btn.acc{background:var(--acc)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.okb{background:var(--ok)}
.btn.nob{background:#fff;color:var(--bad);border:1.5px solid color-mix(in srgb,var(--bad) 55%,#fff)}
.btn:disabled{opacity:.4}
.btn.full{width:100%}
.lib{display:block;text-align:center;color:var(--acc);font:600 15px/1.3 Anuphan,sans-serif;text-decoration:none;padding:12px}

/* ---------- PLAY TOP BAR ---------- */
.ptop{flex:none;padding:calc(var(--sat) + 8px) calc(var(--sar) + 12px) 6px calc(var(--sal) + 8px)}
.ptop .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
.x{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.x:active{background:#EEEAE4}
.pbar{flex:1;height:8px;border-radius:9px;background:#ECE7E0;overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:9px;background:var(--c);transition:width .45s var(--spring)}
.pcount{flex:none;font:600 14px/1 "IBM Plex Mono",monospace;color:var(--muted);min-width:44px;text-align:right}
.combo{flex:none;font:700 13.5px/1 "IBM Plex Mono",monospace;color:var(--acc);background:var(--accbg);border-radius:99px;padding:6px 9px;transform:scale(0);transition:transform .3s var(--spring)}
.combo.on{transform:scale(1)}
.combo.bump{animation:bump .35s var(--spring)}
@keyframes bump{40%{transform:scale(1.3)}}
.sub{max-width:680px;margin:6px auto 0;padding:0 4px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sub i{width:8px;height:8px;border-radius:99px;background:var(--c);flex:none}

/* ---------- QUICK QUIZ ---------- */
.stage{max-width:680px;margin:0 auto;padding:8px calc(var(--sar) + 16px) 16px calc(var(--sal) + 16px)}
.qcard{will-change:transform,opacity}
.qcard.out{animation:qout .17s ease-in forwards}
.qcard.in{animation:qin .42s var(--spring)}
@keyframes qout{to{opacity:0;transform:translateX(-26px) scale(.98)}}
@keyframes qin{from{opacity:0;transform:translateX(30px) scale(.97)}to{opacity:1;transform:none}}
.qq{font:600 21px/1.5 Anuphan,sans-serif;margin:6px 2px 16px;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:13px 14px;min-height:56px;font-size:16px;line-height:1.4;overflow-wrap:anywhere;transition:transform .18s var(--spring),background .2s,border-color .2s,opacity .25s}
.opt:active{transform:scale(.975)}
.opt .ol{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#F3EFE9;color:var(--muted);font:600 13px/1 "IBM Plex Mono",monospace;transition:background .2s,color .2s}
.opt .ot{flex:1;min-width:0}
.opts.done .opt{pointer-events:none}
.opts.done .opt:not(.right):not(.wrong){opacity:.45}
.opts.miss .opt:not(.right):not(.wrong){display:none}
.opt.right{background:var(--okbg);border-color:var(--ok);animation:pop .45s var(--spring)}
.opt.right .ol{background:var(--ok);color:#fff}
.opt.wrong{background:var(--badbg);border-color:var(--bad);animation:shake .4s}
.opt.wrong .ol{background:var(--bad);color:#fff}
@keyframes pop{40%{transform:scale(1.03)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.why{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 15px;font-size:15px;line-height:1.6;animation:qin .35s var(--spring)}
.why .wa{font:700 16px/1.4 Anuphan,sans-serif;color:var(--ok);margin-bottom:4px}
.tip{display:flex;gap:10px;margin-top:10px;padding:10px 12px;border-radius:14px;background:#FFF5DC;color:#4F3D0E;font-size:14.5px;line-height:1.55}
.tip .ti{flex:none;width:26px;height:26px;border-radius:8px;background:#F7C948;display:grid;place-items:center}
.tip b{display:block;font:700 12px/1.3 Anuphan,sans-serif;color:#8A6410;margin-bottom:1px}
.pbot{flex:none;padding:10px calc(var(--sar) + 16px) calc(var(--sab) + 12px) calc(var(--sal) + 16px);background:linear-gradient(to top,var(--bg) 70%,transparent)}
.pbot .in{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:center}
.verdict{flex:1;min-width:0;font:700 16px/1.3 Anuphan,sans-serif;display:flex;align-items:center;gap:8px}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.nextb{position:relative;overflow:hidden;min-width:132px}
.nextb .cd{position:absolute;left:0;bottom:0;height:4px;width:0;background:rgba(255,255,255,.55)}
.nextb.timing .cd{width:100%;transition:width 1.05s linear}
.hint{color:var(--faint);font-size:13px;text-align:center;flex:1}

/* ---------- FLASH ---------- */
.fstage{flex:1;min-height:0;display:flex;padding:8px calc(var(--sar) + 16px) 8px calc(var(--sal) + 16px)}
.fcard{position:relative;flex:1;max-width:680px;margin:0 auto;display:flex;min-height:0;touch-action:pan-y}
.face{flex:1;min-height:0;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:26px;padding:20px 20px 22px;display:flex;flex-direction:column;box-shadow:0 18px 40px -26px rgba(40,30,20,.45);-webkit-overflow-scrolling:touch}
.fcard.drag .face{transition:none}
.face.anim{animation:flip .3s ease-out}
@keyframes flip{from{transform:perspective(1200px) rotateY(75deg);opacity:.4}to{transform:none;opacity:1}}
.fh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:10px}
.fh .s{display:flex;align-items:center;gap:7px;min-width:0}
.fh .s i{width:9px;height:9px;border-radius:99px;background:var(--c);flex:none}
.side{flex:none;font:600 12px/1 Anuphan,sans-serif;padding:5px 9px;border-radius:99px;background:#F3EFE9;color:var(--muted)}
.back .side{background:var(--okbg);color:var(--ok)}
.fq{flex:1;display:flex;align-items:center;font:600 22px/1.5 Anuphan,sans-serif;overflow-wrap:anywhere}
.ftip{font-size:13px;color:var(--faint);text-align:center;margin-top:10px}
.bq{font-size:14px;color:var(--muted);padding-bottom:9px;border-bottom:1px dashed var(--line);overflow-wrap:anywhere}
.ba{font:700 22px/1.4 Anuphan,sans-serif;color:var(--ok);margin:10px 0 6px;overflow-wrap:anywhere}
.be{font-size:15.5px;line-height:1.6;overflow-wrap:anywhere}
.stamp{position:absolute;top:22px;padding:6px 14px;border-radius:12px;border:3px solid;font:700 18px/1 Anuphan,sans-serif;opacity:0;pointer-events:none;background:#fff}
.stamp.l{left:18px;color:var(--bad);transform:rotate(-12deg)}
.stamp.r{right:18px;color:var(--ok);transform:rotate(12deg)}
.fl .btn,.fr .btn{height:56px}

/* ---------- MATCH ---------- */
.mstage{max-width:1100px;margin:0 auto;padding:6px calc(var(--sar) + 14px) 16px calc(var(--sal) + 14px)}
.qbox{background:#fff;border:1.5px solid var(--c);border-radius:20px;padding:11px 14px 13px}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.qhead .qn{font:600 12.5px/1.2 Anuphan,sans-serif;color:var(--c);margin-right:auto}
.qd{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font:600 13px/1 "IBM Plex Mono",monospace;color:var(--muted)}
.qd.cur{border-color:var(--c);background:var(--c);color:#fff}
.qd.done{border-color:#A9DDC4;background:var(--okbg);color:var(--ok)}
.qdots{display:flex;gap:5px}
.qt{font:600 17px/1.5 Anuphan,sans-serif;overflow-wrap:anywhere}
.mfb{min-height:21px;margin:8px 2px;font:600 13.5px/1.4 Anuphan,sans-serif;color:var(--muted);overflow-wrap:anywhere}
.mfb.ok{color:var(--ok)}.mfb.bad{color:var(--bad)}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acard{display:flex;align-items:center;text-align:left;border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:9px 11px;font-size:15px;line-height:1.4;font-weight:500;overflow-wrap:anywhere;min-height:62px;transition:transform .18s var(--spring)}
.acard:active{transform:scale(.97)}
.acard.bad{border-color:var(--bad);background:var(--badbg);animation:shake .4s}
.acard.decoy{background:#F5F2EE;border-style:dashed;color:var(--muted);flex-direction:column;align-items:flex-start;justify-content:center;gap:4px}
.dl{display:inline-block;font:600 12px/1.2 Anuphan,sans-serif;color:var(--bad);background:var(--badbg);border-radius:99px;padding:2px 8px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.colh{font:600 13.5px/1.3 Anuphan,sans-serif;color:var(--muted);margin:0 0 8px 4px}
.cl{display:flex;flex-direction:column;gap:9px}
.card{position:relative;text-align:left;width:100%;border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:11px 14px;line-height:1.5;overflow-wrap:anywhere;font-size:16px;transition:transform .18s var(--spring)}
.card:active{transform:scale(.98)}
.card.sel{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset;background:color-mix(in srgb,var(--c) 7%,#fff)}
.card.ok{border-color:#A9DDC4;background:var(--okbg);padding-right:46px}
.card .badge{position:absolute;top:10px;right:10px;display:grid;place-items:center;width:28px;height:28px;border-radius:99px;background:var(--ok);color:#fff;font:600 13px/1 "IBM Plex Mono",monospace}
.card.bad{border-color:var(--bad);background:var(--badbg);animation:shake .4s}
.card.decoy{background:#F5F2EE;border-style:dashed;color:var(--muted)}
.dfb{margin:2px 4px 12px;min-height:46px;font-size:15px;line-height:1.55;color:var(--muted)}
.dfb.ok b{color:var(--ok)}.dfb.bad b{color:var(--bad)}.dfb.ok,.dfb.bad{color:var(--ink)}

/* ---------- DONE ---------- */
#done .mid{padding:calc(var(--sat) + 26px) 0 calc(var(--sab) + 24px)}
.dhero{text-align:center}
.bigring{position:relative;width:150px;height:150px;margin:0 auto}
.bigring svg{transform:rotate(-90deg)}
.bigring circle{transition:stroke-dashoffset 1.1s var(--ease)}
.bigring .rv{position:absolute;inset:0;display:grid;place-items:center;font:700 34px/1 "IBM Plex Mono",monospace}
.bigring .rv small{display:block;font:500 13px/1.3 "IBM Plex Sans Thai",sans-serif;color:var(--muted);margin-top:4px}
.dhero h2{font-size:25px;margin-top:14px}
.dhero p{color:var(--muted);margin:4px 0 0}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.dstats div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.dstats span{display:block;font-size:12.5px;color:var(--muted)}
.dstats b{font:600 20px/1.3 "IBM Plex Mono",monospace}
.dacts{display:flex;flex-direction:column;gap:8px}
.rvh{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px}
.rvh h3{font-size:15.5px}
.rvi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:14.5px;line-height:1.55}
.rvi.good{border-left-color:var(--ok)}
.rvi .q{font-weight:600}
.rvi .a{color:var(--ok);font-weight:600;margin-top:2px}
.rvi .e{color:var(--muted);font-size:14px;margin-top:3px}
.rvi .m{margin-top:6px;font-size:13.5px;color:#5C4810;background:#FFF5DC;border-radius:9px;padding:6px 10px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--r));opacity:.8}}

/* ---------- SETTINGS ---------- */
.opt2+.opt2{margin-top:16px}
.opt2 .lb{font:600 14.5px/1.3 Anuphan,sans-serif;margin:0 0 8px}
.opt2 .ds{font-size:13px;color:var(--muted);margin:7px 0 0;line-height:1.5}
.danger{color:var(--bad);font:600 15px/1.3 Anuphan,sans-serif;padding:10px 0}

@media (max-width:759px){ .board,.dfb{display:none} }
@media (min-width:760px){
  #mphone{display:none}
  .greet{font-size:30px}
  .chap{grid-template-columns:repeat(4,1fr)}
  .stile{min-height:170px}
  .qq{font-size:24px}
  .fcard{max-height:620px;align-self:center;height:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-height:620px){.greet{font-size:22px;margin:4px 0 10px}.mseg{margin:14px 0 10px}.mseg button{padding:11px 6px}.ch{min-height:58px;padding:9px 11px}}
@media (max-width:370px){.qq{font-size:19px}.opt{font-size:15px}.acard{font-size:14px}.greet{font-size:24px}}
</style>
</head>

      <span class="rv"><span><span id="ringN">0</span><small id="ringOf">/20</small></span></span>
    </span>
  </button>

  <div class="mseg" id="homeSeg" role="group" aria-label="วิธีทบทวน"><button data-m="quick">ทวนเร็ว</button><button data-m="flash">Flash cards</button><button data-m="match">จับคู่</button></div>
  <div class="chap" id="chap"></div>
 </div></div>

<script>
const DATA=/*DATA*/;
(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rich=s=>esc(s).replace(/\u0001/g,"<mark>").replace(/\u0002/g,"</mark>").replace(/\n/g,"<br>");
const plain=s=>String(s).replace(/[\u0001\u0002]/g,"");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const buzz=p=>{try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}};
const phoneMQ=window.matchMedia("(max-width:759px)");
const isPhone=()=>phoneMQ.matches;
const reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;

/* ---------- data ---------- */
const DECKS=DATA.decks, DECK=new Map(DECKS.map(d=>[d.id,d]));
const ITEMS=DATA.items, BY=new Map(ITEMS.map(x=>[x.i,x]));
const ofDeck=id=>ITEMS.filter(x=>x.d===id);
const ofGroup=g=>ITEMS.filter(x=>DECK.get(x.d).g===g);
const deckColor=id=>(DECK.get(id)||{}).c||"#E8613C";

/* ---------- spaced repetition ---------- */
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5);
const GAP=[0,1,2,4,8,16,32];
let SRS=store.get("bc-srs",null);
if(!SRS){ // carry over cards marked "จำได้แล้ว" in the previous version
  SRS={};const t=today();
  store.get("mg-known",[]).forEach(id=>{if(BY.has(id))SRS[id]=[2,t+2,1,0]});
  store.set("bc-srs",SRS);
}
const saveSRS=()=>store.set("bc-srs",SRS);
const seen=id=>!!SRS[id];
const isDue=id=>SRS[id]&&SRS[id][1]<=today();
const mastered=id=>SRS[id]&&SRS[id][0]>=3;
function grade(id,ok){
  const t=today(),s=SRS[id]||[0,t,0,0];
  s[2]++;
  if(ok){s[0]=Math.min(s[0]+1,GAP.length-1);s[1]=t+GAP[s[0]]}
  else{s[0]=1;s[1]=t;s[3]++}
  SRS[id]=s;saveSRS();tick(ok);
}
let PREF=Object.assign({len:15,goal:20,mode:"quick"},store.get("bc-pref",{}));
const savePref=()=>store.set("bc-pref",PREF);
let DAY=store.get("bc-day",{d:0,n:0,ok:0,streak:0,last:0});
function tick(ok){
  const t=today();
  if(DAY.d!==t){DAY.d=t;DAY.n=0;DAY.ok=0}
  if(DAY.last!==t){DAY.streak=(DAY.last===t-1?DAY.streak:0)+1;DAY.last=t}
  DAY.n++;if(ok)DAY.ok++;
  store.set("bc-day",DAY);
}
function streakNow(){const t=today();return (DAY.last===t||DAY.last===t-1)?DAY.streak:0}
function doneToday(){return DAY.d===today()?DAY.n:0}

function buildSet(pool,n,newCap){
  const due=pool.filter(x=>isDue(x.i)).sort((a,b)=>SRS[a.i][1]-SRS[b.i][1]||SRS[a.i][0]-SRS[b.i][0]);
  let out=due.slice(0,n);
  if(out.length<n){
    const fresh=shuffle(pool.filter(x=>!seen(x.i))).slice(0,Math.min(newCap,n-out.length));
    out=out.concat(fresh);
  }
  if(out.length<n){ // everything learned: practise the weakest ones
    const rest=pool.filter(x=>!out.includes(x)).sort((a,b)=>(SRS[a.i]?SRS[a.i][0]:0)-(SRS[b.i]?SRS[b.i][0]:0)||Math.random()-.5);
    out=out.concat(rest.slice(0,n-out.length));
  }
  return shuffle(out);
}
function dailyCounts(){
  const due=ITEMS.filter(x=>isDue(x.i)).length;
  const fresh=Math.max(0,Math.min(PREF.len-due,8));
  return {due,fresh};
}

/* ---------- navigation ---------- */
const SCREENS=["home","quick","flash","match","done"];
function show(id){
  SCREENS.forEach(s=>{const el=$(s);const on=s===id;el.hidden=!on;if(on){el.classList.remove("enter");void el.offsetWidth;el.classList.add("enter")}});
  closeSheets();
}
function toHome(){clearTimeout(Q&&Q.timer);show("home");renderHome()}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=toHome);

/* ---------- HOME ---------- */
function setRing(arc,frac,len){arc.style.strokeDashoffset=String(len*(1-Math.max(0,Math.min(1,frac))))}
function renderHome(){
  const h=new Date().getHours();
  $("greet").textContent=h<5?"ดึกแล้ว ทวนสั้น ๆ ก็พอ":h<12?"อรุณสวัสดิ์":h<17?"สวัสดีตอนบ่าย":"สวัสดีตอนเย็น";
  const st=streakNow();$("streakN").textContent=st;$("streak").classList.toggle("off",!st);
  const {due,fresh}=dailyCounts(),dn=doneToday();
  $("heroSub").textContent=due?(due+" ใบที่ใกล้ลืม"+(fresh?" · ใบใหม่ "+fresh:"")):(dn?"วันนี้ทวนไปแล้ว "+dn+" ใบ · ไปต่ออีกนิด":"เริ่มด้วยการ์ดใหม่ "+Math.min(PREF.len,8)+" ใบ");
  $("ringN").textContent=Math.min(dn,PREF.goal);$("ringOf").textContent="/"+PREF.goal;
  requestAnimationFrame(()=>setRing($("ringArc"),dn/PREF.goal,226.2));
  document.querySelectorAll("#homeSeg button").forEach(b=>{b.setAttribute("aria-pressed",String(b.dataset.m===PREF.mode));b.onclick=()=>{PREF.mode=b.dataset.m;savePref();buzz(6);renderHome()}});
  const box=$("chap");box.innerHTML="";
  const tile=(label,badge,color,pool,go)=>{
    const m=pool.filter(x=>mastered(x.i)).length,b=document.createElement("button");
    b.className="ch press";b.style.setProperty("--tc",color);
    b.innerHTML='<span class="no">'+badge+'</span><b>'+esc(label)+'</b><span class="mbar"><i style="width:'+(m/pool.length*100)+'%"></i></span>';
    b.onclick=go;box.appendChild(b);
  };
  DECKS.forEach(d=>tile(d.name,d.badge,d.c,ofDeck(d.id),()=>startDeck(d.id,null,PREF.mode)));
  tile("รวมทุกบท","★","#6E6876",ITEMS,()=>startPool(ITEMS,"ทุกบท","all"));
}
$("hero").onclick=()=>{
  const {due,fresh}=dailyCounts();
  const n=Math.max(PREF.len,0);
  const set=buildSet(ITEMS,n,due>=n?0:8);
  startQuick(set,{title:"ทบทวนวันนี้",again:()=>$("hero").onclick()});
};


/* ---------- SHEETS ---------- */
const MODE_NAME={quick:"ทวนเร็ว",flash:"Flash cards",match:"จับคู่"};
const MODE_NOTE={quick:"แตะคำตอบเดียวต่อข้อ ระบบจำว่าข้อไหนต้องกลับมาทวน",flash:"นึกคำตอบ แตะเพื่อพลิก แล้วปัดขวาถ้าจำได้",match:"จับคู่คำถามกับคำตอบ มีตัวหลอกปน"};
let sheetGroup=null,openRow=null,rowSecs=null;
function openSheet(id){$("scrim").classList.add("on");$(id).classList.add("on")}
function closeSheets(){$("scrim").classList.remove("on");$("sheet").classList.remove("on");$("setSheet").classList.remove("on")}
$("scrim").onclick=closeSheets;
function sectionsOf(deck){const m=new Map();ofDeck(deck).forEach(x=>m.set(x.s,(m.get(x.s)||0)+1));return [...m]}
function openDeckSheet(g){sheetGroup=g;openRow=null;rowSecs=null;renderSheet();openSheet("sheet")}
function renderSheet(){
  const g=sheetGroup;
  $("shTitle").textContent=g==="bio"?"ชีววิทยา":"ยา";
  document.querySelectorAll("#modeSeg button").forEach(b=>{
    b.setAttribute("aria-pressed",String(b.dataset.m===PREF.mode));
    b.onclick=()=>{PREF.mode=b.dataset.m;savePref();renderSheet()};
  });
  $("segNote").textContent=MODE_NOTE[PREF.mode];
  const body=$("shBody");body.innerHTML="";
  const decks=DECKS.filter(d=>d.g===g);
  const mk=(id,label,sub,color,badge,pool)=>{
    const m=pool.filter(x=>mastered(x.i)).length,due=pool.filter(x=>isDue(x.i)).length,nw=pool.filter(x=>!seen(x.i)).length;
    const row=document.createElement("div");row.className="drow"+(openRow===id?" open":"");row.style.setProperty("--tc",color);
    row.innerHTML='<div class="main"><button class="dgo press"><span class="dno">'+badge+'</span><span class="dinfo"><b>'+esc(label)+'</b><small>'+esc(sub)+' · '+(due?"ใกล้ลืม "+due+" · ":"")+(nw?"ใหม่ "+nw:"เรียนครบแล้ว")+'</small><span class="mbar"><i style="width:'+(m/pool.length*100)+'%"></i></span></span></button>'+

function flipCard(){if(!F||!F.cur)return;F.flipped=!F.flipped;face(F.flipped,true);buzz(6)}
function rate(ok){
  if(!F||!F.cur||!F.flipped)return;
  const it=F.cur,prev=F.status.get(it.i);
  F.status.set(it.i,ok?"yes":"no");
  if(!prev){grade(it.i,ok);F.all.push(it)}
  if(ok){F.yes.add(it.i);F.queue=F.queue.filter(x=>x!==it);buzz(12)}
  else{F.yes.delete(it.i);F.no.set(it.i,it);if(!F.queue.includes(it))F.queue.splice(Math.min(F.queue.length,4+Math.floor(Math.random()*3)),0,it);buzz([25,40,25])}

(function(){ // drag to rate (after flip), tap to flip
  const fc=$("fcard");let sx=0,sy=0,dx=0,drag=false,moved=false;
  fc.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;sx=e.clientX;sy=e.clientY;dx=0;drag=true;moved=false;fc.style.transition="none"});

/* ---------- MATCH ---------- */
const toks=s=>s.toLowerCase().replace(/[()·,.:;'"“”‘’\-–—→+]/g," ").split(/\s+/).filter(Boolean);
const core=s=>s.replace(/\([^)]*\)/g," ");
function hasSeq(a,b){if(!b.length||b.length>a.length)return false;outer:for(let i=0;i<=a.length-b.length;i++){for(let j=0;j<b.length;j++)if(a[i+j]!==b[j])continue outer;return true}return false}
function clash(x,y){const a=toks(x),b=toks(y),ca=toks(core(x)),cb=toks(core(y));return hasSeq(a,b)||hasSeq(b,a)||(ca.length&&cb.length&&(hasSeq(ca,cb)||hasSeq(cb,ca)))}
const isNum=s=>/\d/.test(s)&&/^[\d\s.,:/%×x+\-−–~≈<>=]+[a-zA-Zก-๙ ]{0,14}$/.test(s.trim());
let M=null,MD=null;
function compatible(it,chosen){
  for(const c of chosen){if(clash(c.a,it.a)||c.q===it.q)return false}
  if(isNum(it.a)&&chosen.filter(c=>isNum(c.a)).length>=2)return false;
  return true;
}
function drawRound(n){
  const free=MD.items.filter(it=>!MD.used.has(it.i));
  if(!free.length)return [];
  const seed=free[0],chosen=[seed];
  const tiers=[free.filter(x=>x!==seed&&x.d===seed.d&&x.s===seed.s),free.filter(x=>x!==seed&&x.d===seed.d&&x.s!==seed.s),free.filter(x=>x.d!==seed.d)];
  for(const tier of tiers)for(const it of tier){if(chosen.length>=n)break;if(compatible(it,chosen))chosen.push(it)}
  return chosen;
}
function pickDecoys(items,k){
  const out=[],answers=items.map(x=>x.a),pools=shuffle(items).map(it=>shuffle(it.x||[]));
  let progress=true;
  while(out.length<k&&progress){progress=false;for(const pl of pools){if(out.length>=k)break;while(pl.length){const d=pl.shift();if(answers.some(a=>clash(a,d))||out.some(o=>clash(o,d)))continue;out.push(d);progress=true;break}}}
  return out;
}
function startMatch(pool,meta){
  // weakest / due first so matching also feeds spaced repetition
  const ordered=shuffle(pool).sort((a,b)=>(isDue(a.i)?0:1)-(isDue(b.i)?0:1)||(SRS[a.i]?SRS[a.i][0]:-1)-(SRS[b.i]?SRS[b.i][0]:-1));
  MD={items:ordered,used:new Set(),meta,round:0};
  nextRound();
}
function nextRound(){
  const n=isPhone()?4:6;
  let items=drawRound(n);
  if(items.length<3){MD.used.clear();MD.items=shuffle(MD.items);items=drawRound(n)}
  if(!items.length)return toHome();
  items.forEach(it=>MD.used.add(it.i));MD.round++;
  const decoys=pickDecoys(items,Math.ceil(items.length/2)),qOrder=shuffle(items);
  M={items,decoys,qOrder,ans:shuffle(items.map(it=>({id:it.i,t:it.a})).concat(decoys.map((d,i)=>({id:"decoy-"+i,t:d})))),
     matched:new Set(),order:new Map(),cur:qOrder[0].i,sel:null,miss:0,combo:0,best:0,missed:new Map(),busy:false,end:null,fb:null,t0:Date.now()};
  show("match");
  document.documentElement.style.setProperty("--c",deckColor(items[0].d));
  $("mMeta").textContent=MD.meta.title+" · รอบ "+MD.round+" · ตัวหลอก "+decoys.length+" ใบ";
  renderMatch();
}
function renderMatch(){
  $("mCount").textContent=M.matched.size+"/"+M.items.length;
  $("mBar").style.width=(M.matched.size/M.items.length*100)+"%";
  isPhone()?renderMPhone():renderMDesk();
}
function renderMPhone(){
  const dots=$("mdots");dots.innerHTML="";
  M.qOrder.forEach((it,i)=>{
    const b=document.createElement("button");b.className="qd";const done=M.matched.has(it.i);
    b.textContent=done?"✓":i+1;if(done)b.classList.add("done");if(it.i===M.cur)b.classList.add("cur");
    b.disabled=done||!!M.end;b.onclick=()=>{M.cur=it.i;M.fb=null;renderMatch()};dots.appendChild(b);
  });
  const idx=M.qOrder.findIndex(x=>x.i===M.cur),cur=M.qOrder[idx];
  $("mqn").textContent="ข้อ "+(idx+1)+" จาก "+M.items.length;$("mqt").textContent=cur?cur.q:"";
  const f=$("mfb");
  if(M.fb){f.className="mfb "+M.fb.kind;f.textContent=M.fb.short}else{f.className="mfb";f.textContent="แตะคำตอบที่คู่กับคำถามนี้"}
  const ag=$("agrid");ag.innerHTML="";
  M.ans.filter(o=>!M.matched.has(o.id)).forEach(o=>{
    const b=document.createElement("button");b.className="acard";b.dataset.id=o.id;
    if(M.end&&o.id.startsWith("decoy-")){b.classList.add("decoy");b.innerHTML='<span>'+esc(o.t)+'</span><span class="dl">ตัวหลอก</span>'}else b.textContent=o.t;
    if(M.end)b.disabled=true;

function renderMDesk(){
  const f=$("dfb");
  if(!M.fb){f.className="dfb";f.textContent="แตะคำถามทางซ้าย แล้วแตะคำตอบทางขวาที่คู่กัน"}else{f.className="dfb "+M.fb.kind;f.innerHTML='<b>'+esc(M.fb.head)+'</b> '+M.fb.body}
  $("colAh").textContent="คำตอบ ("+M.ans.length+" ใบ · ตัวหลอก "+M.decoys.length+")";
  const cq=$("colQ"),ca=$("colA");cq.innerHTML="";ca.innerHTML="";
  M.qOrder.forEach(it=>{
    const b=document.createElement("button");b.className="card";b.dataset.id=it.i;const done=M.matched.has(it.i);
    if(done){b.classList.add("ok");b.disabled=true}
    if(M.sel&&M.sel.side==="q"&&M.sel.id===it.i)b.classList.add("sel");
    b.innerHTML=esc(it.q)+(done?'<span class="badge">'+M.order.get(it.i)+'</span>':"");
    if(M.end)b.disabled=true;b.onclick=()=>dtap("q",it.i);cq.appendChild(b);
  });
  M.ans.forEach(o=>{
    const b=document.createElement("button");b.className="card";b.dataset.id=o.id;const done=M.matched.has(o.id),dec=o.id.startsWith("decoy-");
    if(done){b.classList.add("ok");b.disabled=true}
    if(M.sel&&M.sel.side==="a"&&M.sel.id===o.id)b.classList.add("sel");
    if(M.end){b.disabled=true;if(dec)b.classList.add("decoy")}
    b.innerHTML=esc(o.t)+(done?'<span class="badge">'+M.order.get(o.id)+'</span>':"")+(M.end&&dec?' <span class="dl">ตัวหลอก</span>':"");
    b.onclick=()=>dtap("a",o.id);ca.appendChild(b);
  });
}
function dtap(side,id){
  if(M.busy||M.end||M.matched.has(id))return;
  if(!M.sel||M.sel.side===side){M.sel=(M.sel&&M.sel.id===id)?null:{side,id};renderMatch();return}
  const qid=side==="q"?id:M.sel.id,aid=side==="a"?id:M.sel.id;M.sel=null;mcheck(qid,aid);
}
function mcheck(qid,aid){
  const it=BY.get(qid);
  if(qid===aid){
    M.matched.add(qid);M.order.set(qid,M.order.size+1);M.combo++;M.best=Math.max(M.best,M.combo);
    buzz(12);comboUI($("mCombo"),M.combo);
    M.fb={kind:"ok",head:"✓ ถูกต้อง",short:"✓ "+it.a,body:it.e?rich(it.e):esc(it.a)};
    const nq=M.qOrder.find(x=>!M.matched.has(x.i));if(nq)M.cur=nq.i;
    renderMatch();
    if(M.matched.size===M.items.length){M.end="win";setTimeout(()=>finish("match"),650)}
  }else{
    M.miss++;M.combo=0;comboUI($("mCombo"),0);M.missed.set(qid,it);
    const other=BY.get(aid);if(other&&M.items.includes(other))M.missed.set(other.i,other);
    buzz([30,50,30]);
    M.fb={kind:"bad",head:"✗ ยังไม่ใช่",short:"✗ ยังไม่ใช่ ลองใหม่",body:"ลองอ่านคำถามอีกครั้ง"};
    renderMatch();M.busy=true;
    const sel=isPhone()?['#agrid [data-id="'+aid+'"]']:['#colQ [data-id="'+qid+'"]','#colA [data-id="'+aid+'"]'];
    const els=sel.map(s=>document.querySelector(s)).filter(Boolean);els.forEach(x=>x.classList.add("bad"));
    setTimeout(()=>{els.forEach(x=>x.classList.remove("bad"));M.busy=false},450);
  }
}
if(phoneMQ.addEventListener)phoneMQ.addEventListener("change",()=>{if(M&&!$("match").hidden)renderMatch()});

/* ---------- DONE ---------- */
function confetti(){
  if(reduce)return;
  const box=document.createElement("div");box.className="confetti";
  const cols=["#FF8A5B","#E8613C","#2C9C69","#F7C948","#5B8DEF","#C2408A"];
  for(let i=0;i<46;i++){const p=document.createElement("i");p.style.left=Math.random()*100+"%";p.style.background=cols[i%cols.length];
    p.style.setProperty("--dx",(Math.random()*160-80)+"px");p.style.setProperty("--r",(Math.random()*720-360)+"deg");p.style.animationDelay=Math.random()*.35+"s";box.appendChild(p)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),2300);
}
function rvItem(it,good){
  return '<div class="rvi'+(good?" good":"")+'"><div class="q">'+esc(it.q)+'</div><div class="a">→ '+esc(it.a)+'</div>'+(it.e?'<div class="e">'+rich(it.e)+'</div>':"")+(it.m?'<div class="m"><b>'+(it.k==="p"?"Pearl":"Trick")+':</b> '+esc(it.m)+'</div>':"")+'</div>';
}
function finish(kind){
  let total,ok,missed,items,meta,again,best=0,extra="";
  if(kind==="quick"){total=Q.total;ok=Q.ok;missed=[...Q.missed.values()];items=[...new Set(Q.all)];meta=Q.meta;again=meta.again;best=Q.best;extra=Math.round((Date.now()-Q.t0)/1000)}
  else if(kind==="flash"){total=F.total;ok=F.total-F.no.size;missed=[...F.no.values()];items=F.hist.filter((x,i,a)=>a.indexOf(x)===i);meta=F.meta;again=meta.again}
  else{
    M.items.forEach(it=>grade(it.i,!M.missed.has(it.i)));
    total=M.items.length;ok=total-M.missed.size;missed=[...M.missed.values()];items=M.items;meta=MD.meta;again=()=>nextRound();best=M.best;extra=Math.round((Date.now()-M.t0)/1000);
  }
  show("done");
  const pct=total?Math.round(ok/total*100):0;
  $("dPct").textContent=pct+"%";
  const arc=$("dArc");arc.style.stroke=pct>=80?"var(--ok)":pct>=50?"#F2A33A":"var(--bad)";
  arc.style.transition="none";arc.style.strokeDashoffset="402.1";void arc.getBoundingClientRect();arc.style.transition="";
  requestAnimationFrame(()=>requestAnimationFrame(()=>setRing(arc,pct/100,402.1)));
  $("dTitle").textContent=pct===100?"สมบูรณ์แบบ!":pct>=80?"เยี่ยมมาก":pct>=50?"ดีขึ้นเรื่อย ๆ":"ไม่เป็นไร รอบหน้าจะง่ายขึ้น";
  $("dSub").textContent=meta.title+" · ข้อที่พลาดจะกลับมาให้ทวนอีก";
  const dn=doneToday();
  $("dStats").innerHTML=[["ถูกรอบแรก",ok+"/"+total],[kind==="flash"?"วันนี้":"ต่อเนื่องสูงสุด",kind==="flash"?dn+" ใบ":"×"+best],["เป้าวันนี้",Math.min(dn,PREF.goal)+"/"+PREF.goal]].map(([a,b])=>'<div><span>'+a+'</span><b>'+b+'</b></div>').join("");
  const acts=$("dActs");acts.innerHTML="";
  const add=(t,cls,fn)=>{const b=document.createElement("button");b.className="btn full press "+cls;b.textContent=t;b.onclick=fn;acts.appendChild(b);return b};
  add(kind==="match"?"รอบต่อไป":"ทวนต่ออีกรอบ","acc",again).focus({preventScroll:true});
  if(missed.length&&kind!=="match")add("ทวนเฉพาะข้อที่พลาด ("+missed.length+")","ghost",()=>startQuick(shuffle(missed),{title:"ข้อที่พลาด",again:()=>startQuick(shuffle(missed),{title:"ข้อที่พลาด",again})}));
  add("กลับหน้าแรก","ghost",toHome);
  const good=items.filter(x=>!missed.includes(x));
  $("dRv").innerHTML=(missed.length?'<div class="rvh"><h3>ข้อที่ควรทวน</h3></div>'+missed.map(x=>rvItem(x,false)).join(""):"")+
    (good.length?'<div class="rvh"><h3>ข้อที่ตอบถูก</h3></div>'+good.map(x=>rvItem(x,true)).join(""):"");
  if(pct>=80)setTimeout(confetti,350);
  buzz(pct>=80?[15,60,15,60,30]:10);
}

renderHome();
})();
</script>
