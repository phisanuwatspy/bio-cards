<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F1F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drug Quiz">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<title>Drug Quiz · คลังยาและข้อสอบสุ่ม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F1F6;--surface:#fff;--ink:#1C1A2B;--muted:#5D5972;--line:#DBD7E5;--acc:#46378C;--accbg:#EEEBFA;
  --ok:#2E7D4F;--okbg:#E6F4EC;--bad:#C2364B;--badbg:#FBE9EC;--hl:#FFF4CF;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.55 "IBM Plex Sans Thai",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow-wrap:anywhere}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3{font-family:Anuphan,sans-serif;margin:0;line-height:1.3}
[hidden]{display:none!important}
.wrap{max-width:780px;margin:0 auto;padding:0 calc(16px + var(--sar)) calc(28px + var(--sab)) calc(16px + var(--sal))}

/* ---------- home ---------- */
.hero{padding:calc(var(--sat) + 18px) 0 14px}
.back{display:inline-block;color:var(--acc);text-decoration:none;font-weight:600;font-size:15px;margin-bottom:8px}
.hero h1{font-size:30px}
.hero p{margin:4px 0 0;color:var(--muted);font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#E4E1EC;border-radius:14px;padding:4px;gap:4px;margin:6px 0 18px}
.seg button{border:0;background:none;border-radius:11px;padding:11px 8px;font:600 17px/1.2 Anuphan,sans-serif;color:var(--muted)}
.seg button[aria-selected="true"]{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(28,26,43,.12)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px 18px;margin-bottom:14px}
.card h2{font-size:18px;margin-bottom:10px}
.card h2 small{font:500 14px "IBM Plex Sans Thai",sans-serif;color:var(--muted);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:15.5px;line-height:1.3;display:inline-flex;align-items:center;gap:7px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--acc));flex:none}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.chip[aria-pressed="true"] .dot{background:#fff}
.chip .k{opacity:.75;font-size:13.5px}
.btn{border:0;border-radius:14px;padding:14px 20px;font:600 18px/1.2 Anuphan,sans-serif;background:var(--acc);color:#fff;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}
.actions{display:grid;gap:10px;margin-top:4px}
.hint{color:var(--muted);font-size:14.5px;margin:8px 0 0}

/* library */
.search{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;font-size:17px;margin-bottom:10px}
.search:focus{outline:none;border-color:var(--acc)}
.libcat{margin:18px 0 8px;font-size:17px;display:flex;align-items:center;gap:8px}
.libcat .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
details.drug{background:#fff;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;margin-bottom:8px}
details.drug summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
details.drug summary::-webkit-details-marker{display:none}
details.drug summary b{font:600 17.5px/1.3 Anuphan,sans-serif}
details.drug summary span{color:var(--muted);font-size:14.5px;text-align:right}
details.drug[open] summary{border-bottom:1px solid var(--line)}
.info{padding:6px 14px 14px}
.row{padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .lab{display:block;font:600 13.5px/1.3 Anuphan,sans-serif;color:var(--muted);letter-spacing:.02em;margin-bottom:3px}
.row.focus{background:var(--hl);margin:0 -10px;padding:8px 10px;border-radius:10px;border-bottom-color:transparent}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--accbg);color:#2D2366;border-radius:8px;padding:3px 9px;font-size:15px;line-height:1.35}
.info .mini{margin-top:10px}
.empty{color:var(--muted);text-align:center;padding:30px 0}

/* ---------- quiz ---------- */
.topbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(var(--sat) + 8px) calc(14px + var(--sar)) 8px calc(14px + var(--sal))}
.topbar .in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px}
.x{border:0;background:#EFEDF4;border-radius:12px;width:40px;height:40px;font-size:20px;flex:none;display:grid;place-items:center}
.prog{flex:1;min-width:0}
.prog .t{display:flex;justify-content:space-between;font-size:14.5px;color:var(--muted);margin-bottom:5px;gap:8px}
.bar{height:7px;background:#E4E1EC;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.qwrap{padding-top:16px}
.qtype{display:inline-flex;align-items:center;gap:7px;font:600 14px/1.3 Anuphan,sans-serif;color:var(--c);background:#fff;border:1.5px solid var(--c);border-radius:999px;padding:4px 11px;margin-bottom:10px}
.qtext{font:600 21px/1.5 Anuphan,sans-serif;margin:0 0 16px}
.qtext b{color:var(--acc)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-size:17.5px;line-height:1.45;min-height:56px}
.opt .n{flex:none;width:28px;height:28px;border-radius:8px;background:#EFEDF4;display:grid;place-items:center;font:600 15px Anuphan,sans-serif;color:var(--muted);margin-top:1px}
.opt .tx{flex:1;min-width:0}
.opt .sub{display:block;color:var(--muted);font-size:14.5px;margin-top:4px}
.opt:not(:disabled):hover{border-color:var(--acc)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .n{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .n{background:var(--bad);color:#fff}
.opt.dim{opacity:.6}
.fb{margin-top:14px}
.verdict{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.bad{background:var(--badbg);color:var(--bad)}
.verdict b{font:700 18px/1.3 Anuphan,sans-serif}
.verdict .btn{width:auto;padding:11px 18px;font-size:17px}
.fbcard{background:#fff;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px}
.fbcard h3{font-size:19px;padding:12px 14px 0}
.fbcard h3 small{display:block;font:500 15px "IBM Plex Sans Thai",sans-serif;color:var(--muted)}

/* ---------- result ---------- */
.score{text-align:center;padding:calc(var(--sat) + 28px) 0 10px}
.score .big{font:700 54px/1.1 Anuphan,sans-serif;color:var(--acc)}
.score p{margin:6px 0 0;color:var(--muted);font-size:17px}
.miss{background:#fff;border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.miss .q{font-size:16px}
.miss .a{margin-top:6px;color:var(--ok);font-weight:600}
@media (min-width:700px){
  .hero h1{font-size:34px}
  .qtext{font-size:23px}
  .opts{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<div id="home">
  <div class="wrap">
    <header class="hero">
      <a class="back" href="../">‹ Bio Cards</a>
      <h1>Drug Quiz</h1>
      <p id="heroSub"></p>
    </header>
    <div class="seg" role="tablist">
      <button role="tab" data-tab="quiz" aria-selected="true">ทำข้อสอบ</button>
      <button role="tab" data-tab="lib" aria-selected="false">คลังยา</button>
    </div>

    <section id="tab-quiz">
      <div class="card">
        <h2>หมวดยา</h2>
        <div class="chips" id="catChips"></div>
      </div>
      <div class="card">
        <h2>หัวข้อคำถาม</h2>
        <div class="chips" id="grpChips"></div>
      </div>
      <div class="card">
        <h2>จำนวนข้อ</h2>
        <div class="chips" id="numChips"></div>
      </div>
      <div class="actions">
        <button class="btn" id="startBtn">เริ่มทำข้อสอบ</button>
        <button class="btn ghost" id="reviewBtn" hidden></button>
      </div>
      <p class="hint">ทุกครั้งที่กดเริ่ม ระบบจะสุ่มคำถามและตัวเลือกใหม่จากคลังยา ยาที่ตอบผิดจะถูกเก็บไว้ให้ทวนซ้ำ</p>
    </section>

    <section id="tab-lib" hidden>
      <input class="search" id="q" type="search" placeholder="ค้นหาชื่อยา กลุ่มยา ADR หรือข้อบ่งใช้" autocomplete="off">
      <div class="chips" id="libCats"></div>
      <div id="libList"></div>
    </section>
  </div>
</div>

<!-- ================= QUIZ ================= -->
<div id="quiz" hidden>
  <div class="topbar"><div class="in">
    <button class="x" id="quitBtn" aria-label="ออก">✕</button>
    <div class="prog">
      <div class="t"><span id="progT"></span><span id="scoreT"></span></div>
      <div class="bar"><i id="progBar"></i></div>
    </div>
  </div></div>
  <div class="wrap qwrap">
    <div class="qtype" id="qType"></div>
    <h2 class="qtext" id="qText"></h2>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" hidden></div>
  </div>
</div>

<!-- ================= RESULT ================= -->
<div id="result" hidden>
  <div class="wrap">
    <div class="score">
      <div class="big" id="resBig"></div>
      <p id="resSub"></p>
    </div>
    <div class="actions" style="margin:14px 0 18px">
      <button class="btn" id="againBtn">ทำชุดใหม่</button>
      <button class="btn ghost" id="redoBtn">ทวนยาที่ตอบผิดในชุดนี้</button>
      <button class="btn ghost" id="homeBtn">กลับหน้าแรก</button>
    </div>
    <div id="missList"></div>
  </div>
</div>

<script>
const DATA = {"version":1,"note":"ฐานข้อมูลยา pilot 46 ตัว. ADR/ข้อบ่งใช้/CI-DDI เก็บแบบ tag → รายชื่อยา: yes = เกี่ยวข้องชัด, maybe = เกี่ยวข้องบ้าง (จะไม่ถูกใช้เป็นตัวเลือกหลอก). เพิ่มยาใหม่: ใส่ใน drugs แล้วเพิ่ม id ลงใน tag ที่เกี่ยวข้องทุกอัน","categories":[{"id":"cv","name":"Cardiovascular","th":"หัวใจและหลอดเลือด","color":"#C2364B"},{"id":"heme","name":"Hematology","th":"ยาต้านการแข็งตัวของเลือด","color":"#B4531F"},{"id":"endo","name":"Endocrine","th":"ต่อมไร้ท่อ","color":"#2E7D4F"},{"id":"inf","name":"Anti-infective","th":"ยาต้านจุลชีพ","color":"#1F6FA8"},{"id":"cns","name":"CNS","th":"ระบบประสาทและจิตเวช","color":"#46378C"},{"id":"pain","name":"Analgesic","th":"ยาแก้ปวดและต้านอักเสบ","color":"#8A3B8F"},{"id":"gir","name":"GI & Respiratory","th":"ทางเดินอาหารและหายใจ","color":"#0F7C7C"}],"drugs":[{"id":"amlodipine","name":"Amlodipine","cat":"cv","cls":"Dihydropyridine CCB","grp":"ccb","stem":{"s":"-dipine","m":"Dihydropyridine Ca²⁺ channel blocker"},"moa":"Block L-type Ca²⁺ channel ที่ vascular smooth muscle → หลอดเลือดแดงขยาย ลด afterload","pk":"t½ ยาว 30–50 ชม. → OD; ระดับยาคงที่ใน 7–8 วัน","pearl":"บวมที่ข้อเท้าเกิดจากหลอดเลือดแดงขยายมากกว่าดำ (ไม่ใช่น้ำเกิน) จึงตอบสนองต่อ diuretic ไม่ดี"},{"id":"enalapril","name":"Enalapril","cat":"cv","cls":"ACE inhibitor","grp":"acei","stem":{"s":"-pril","m":"ACE inhibitor"},"moa":"ยับยั้ง Angiotensin-converting enzyme → ลด Angiotensin II และลดการสลาย bradykinin","pk":"Prodrug → enalaprilat (active); ให้วันละ 1–2 ครั้ง","pearl":"Bradykinin สะสม → ไอแห้งและ angioedema; ถ้าไอให้เปลี่ยนเป็น ARB"},{"id":"losartan","name":"Losartan","cat":"cv","cls":"Angiotensin II receptor blocker (ARB)","grp":"arb","stem":{"s":"-sartan","m":"Angiotensin II receptor blocker"},"moa":"Block AT₁ receptor ของ Angiotensin II โดยตรง (ไม่เพิ่ม bradykinin)","pk":"Active metabolite E-3174 แรงกว่าตัวยาเดิม; OD","pearl":"ไม่ทำให้ไอแบบ ACEi; มีฤทธิ์ uricosuric เล็กน้อยต่างจาก ARB ตัวอื่น"},{"id":"hctz","name":"Hydrochlorothiazide","cat":"cv","cls":"Thiazide diuretic","grp":"thiazide","moa":"ยับยั้ง Na⁺/Cl⁻ cotransporter (NCC) ที่ distal convoluted tubule","pk":"OD ตอนเช้า; ฤทธิ์ลดลงเมื่อ eGFR < 30","pearl":"จำ 'hyperGLUC': hyperGlycemia, hyperLipidemia, hyperUricemia, hyperCalcemia (ตรงข้ามกับ loop ที่ทำให้ Ca ต่ำ)"},{"id":"furosemide","name":"Furosemide","cat":"cv","cls":"Loop diuretic","grp":"loop","moa":"ยับยั้ง Na⁺/K⁺/2Cl⁻ cotransporter (NKCC2) ที่ thick ascending limb of Henle","pk":"IV ออกฤทธิ์ใน 5 นาที; t½ ~2 ชม.; oral bioavailability ไม่แน่นอน (10–90%)","pearl":"'Loops lose calcium' — ขับ Ca ออก ต่างจาก thiazide; ฉีดเร็วเสี่ยงหูอื้อ"},{"id":"spironolactone","name":"Spironolactone","cat":"cv","cls":"Mineralocorticoid receptor antagonist","grp":"mra","moa":"แย่งจับ aldosterone receptor ที่ collecting duct → ขับ Na⁺ เก็บ K⁺","pk":"Active metabolite (canrenone) t½ ยาว; ฤทธิ์เต็มที่ใช้เวลาหลายวัน","pearl":"โครงสร้าง steroid จับ androgen receptor ด้วย → gynecomastia; eplerenone เลือกจำเพาะกว่า"},{"id":"metoprolol","name":"Metoprolol","cat":"cv","cls":"β₁-selective blocker","grp":"bb","stem":{"s":"-olol","m":"β-blocker"},"moa":"Block β₁ receptor ที่หัวใจ → ลดอัตราการเต้นและแรงบีบตัว ลด renin","pk":"Metabolized โดย CYP2D6; tartrate วันละ 2 ครั้ง, succinate (ER) OD","pearl":"ห้ามหยุดทันที (rebound tachycardia/angina); บดบังอาการใจสั่นของ hypoglycemia"},{"id":"atorvastatin","name":"Atorvastatin","cat":"cv","cls":"HMG-CoA reductase inhibitor (statin)","grp":"statin","stem":{"s":"-vastatin","m":"HMG-CoA reductase inhibitor"},"moa":"ยับยั้ง HMG-CoA reductase (rate-limiting step สร้าง cholesterol) → เพิ่ม LDL receptor ที่ตับ","pk":"t½ ยาว (active metabolites) → กินเวลาใดก็ได้; CYP3A4 substrate","pearl":"ปวดกล้ามเนื้อต้องตรวจ CK; เสี่ยงมากขึ้นเมื่อใช้ร่วมกับ CYP3A4 inhibitor เช่น clarithromycin"},{"id":"warfarin","name":"Warfarin","cat":"heme","cls":"Vitamin K antagonist","grp":"vka","moa":"ยับยั้ง VKORC1 → ลดการสร้าง clotting factor II, VII, IX, X และ protein C, S","pk":"t½ ~40 ชม.; ฤทธิ์เต็มที่ใช้ 5–7 วัน; S-warfarin ผ่าน CYP2C9; ติดตาม INR","pearl":"Protein C ลดลงก่อน → ช่วงแรกเลือดแข็งตัวง่าย (skin necrosis) จึงต้องให้ heparin คลุมไว้; antidote = Vitamin K"},{"id":"heparin","name":"Heparin (UFH)","cat":"heme","cls":"Indirect thrombin inhibitor","grp":"heparin","moa":"จับ antithrombin → เร่งการยับยั้ง thrombin (IIa) และ factor Xa","pk":"IV/SC; ออกฤทธิ์ทันทีเมื่อให้ IV; ติดตาม aPTT; ไม่ผ่านรก","pearl":"HIT เกิดจาก antibody ต่อ heparin–PF4 complex มักวันที่ 5–10; antidote = Protamine sulfate"},{"id":"aspirin","name":"Aspirin","cat":"heme","cls":"Irreversible COX inhibitor (antiplatelet)","grp":"cox","moa":"Acetylate COX-1 แบบ irreversible → ลด thromboxane A₂ ในเกล็ดเลือดตลอดอายุเกล็ดเลือด","pk":"ฤทธิ์ต้านเกล็ดเลือดอยู่ 7–10 วัน (อายุเกล็ดเลือด) แม้ t½ ของยาสั้น","pearl":"Low dose 75–100 mg ต้านเกล็ดเลือด; ห้ามใช้ในเด็กที่ติดเชื้อไวรัส (Reye syndrome)"},{"id":"clopidogrel","name":"Clopidogrel","cat":"heme","cls":"P2Y12 inhibitor","grp":"p2y12","stem":{"s":"-grel","m":"P2Y12 platelet inhibitor"},"moa":"Block P2Y12 ADP receptor บนเกล็ดเลือดแบบ irreversible","pk":"Prodrug ต้องเปลี่ยนเป็น active form ผ่าน CYP2C19","pearl":"คนที่เป็น CYP2C19 poor metabolizer (พบบ่อยในคนเอเชีย) ตอบสนองต่อยาน้อย"},{"id":"rivaroxaban","name":"Rivaroxaban","cat":"heme","cls":"Direct factor Xa inhibitor (DOAC)","grp":"xa","stem":{"s":"-xaban","m":"Direct factor Xa inhibitor"},"moa":"ยับยั้ง factor Xa โดยตรง (ไม่ต้องอาศัย antithrombin)","pk":"ขนาด 15/20 mg ต้องกินพร้อมอาหาร; substrate ของ CYP3A4 และ P-gp","pearl":"ชื่อ '-xaban' = anti-Xa; ไม่ต้องตรวจ INR; ไม่ใช้ใน mechanical valve"},{"id":"metformin","name":"Metformin","cat":"endo","cls":"Biguanide","grp":"biguanide","moa":"ลดการสร้างกลูโคสที่ตับ (gluconeogenesis) ผ่าน AMPK และเพิ่ม insulin sensitivity","pk":"ไม่ถูก metabolize ขับออกทางไตทั้งหมด; กินพร้อมอาหารเพื่อลด GI upset","pearl":"First-line ใน T2DM; ใช้เดี่ยวไม่ทำให้น้ำตาลต่ำและน้ำหนักไม่ขึ้น"},{"id":"glipizide","name":"Glipizide","cat":"endo","cls":"Sulfonylurea","grp":"su","moa":"ปิด K⁺-ATP channel const DRUGS = DATA.drugs, CATS = DATA.categories;
const byId = Object.fromEntries(DRUGS.map(d => [d.id, d]));

const FIELD_TH = {use: "ข้อบ่งใช้", adr: "ADR สำคัญ", ci: "ข้อห้ามใช้ / DDI"};
DRUGS.forEach(d => { d.yes = {}; d.maybe = {}; FIELDS.forEach(f => { d.yes[f] = []; d.maybe[f] = []; }); });
FIELDS.forEach(f => {
  for (const [tag, t] of Object.entries(DATA.tags[f])) {
    t.yes.forEach(id => byId[id].yes[f].push(tag));
    t.maybe.forEach(id => byId[id].maybe[f].push(tag));
  }
});
const linked = (f, tag) => new Set([...DATA.tags[f][tag].yes, ...DATA.tags[f][tag].maybe]);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
// prefer candidates from the same category (harder, more realistic distractors)
function preferSame(target, list, catFn) {
  const same = shuffle(list.filter(x => catFn(x) === target.cat));
  const other = shuffle(list.filter(x => catFn(x) !== target.cat));
  return Math.random() < 0.7 ? same.concat(other) : shuffle(list);
}
function takeUnique(list, keyFn, n, avoid) {
  const seen = new Set(avoid || []), out = [];
  for (const x of list) { const k = keyFn(x); if (seen.has(k)) continue; seen.add(k); out.push(x); if (out.length === n) break; }
  return out;
}
function drugOptions(target, excludeIds) {
  const pool = DRUGS.filter(x => !excludeIds.has(x.id));
  const ds = takeUnique(preferSame(target, pool, x => x.cat), x => x.name, 3, [target.name]);
  if (ds.length < 3) return null;
  return ds.map(x => ({t: x.name, d: x, ok: false}));
}
// a tag looks "plausible" for target if one of its main drugs is in the same category
const tagCat = (f, tag, target) => DATA.tags[f][tag].yes.some(id => byId[id].cat === target.cat) ? target.cat : "_";

/* ---------- question generators ---------- */
const GROUPS = [
  {id: "cls", th: "กลุ่มยา & MOA", types: ["cls", "moa", "moa2drug"]},
  {id: "use", th: "ข้อบ่งใช้", types: ["use", "use2drug"]},
  {id: "adr", th: "ADR", types: ["adr", "adr2drug"]},
  {id: "ci", th: "ข้อห้ามใช้ & DDI", types: ["ci", "ci2drug"]},
  {id: "stem", th: "ชื่อยา (stem)", types: ["stem"]}
];
const TYPE_LABEL = {cls: "กลุ่มยา", moa: "กลไกการออกฤทธิ์", moa2drug: "กลไกการออกฤทธิ์", use: "ข้อบ่งใช้", use2drug: "ข้อบ่งใช้",
  adr: "ADR", adr2drug: "ADR", ci: "ข้อห้ามใช้ & DDI", ci2drug: "ข้อห้ามใช้ & DDI", stem: "ชื่อยา (stem)"};
const FOCUS = {cls: "cls", moa: "moa", moa2drug: "moa", use: "use", use2drug: "use", adr: "adr", adr2drug: "adr", ci: "ci", ci2drug: "ci", stem: "cls"};

function fieldOf(d, f) { // drug field options: distractors from drugs with a different mechanism group
  const pool = DRUGS.filter(x => x.grp !== d.grp);
  const xs = takeUnique(preferSame(d, pool, x => x.cat), x => x[f], 3, [d[f]]);
  if (xs.length < 3) return null;
  return xs.map(x => ({t: x[f], ok: false, info: `${x.name} — ${x.cls}`}));
}
function tagOptions(d, f) { // correct tag of d + tags not linked to d at all
  if (!d.yes[f].length) return null;
  const tag = pick(d.yes[f]);
  const cand = Object.keys(DATA.tags[f]).filter(t => !linked(f, t).has(d.id));
  const xs = takeUnique(preferSame(d, cand, t => tagCat(f, t, d)), t => t, 3);
  if (xs.length < 3) return null;
  const who = t => DATA.tags[f][t].yes.map(id => byId[id].name).join(", ");
  return {tag, opts: xs.map(t => ({t, ok: false, info: `${t}: พบใน ${who(t)}`}))};
}
function tag2drug(d, f) {
  if (!d.yes[f].length) return null;
  const tag = pick(d.yes[f]);
  const opts = drugOptions(d, linked(f, tag));
  return opts && {tag, opts};
}
const GEN = {
  cls(d) { const o = fieldOf(d, "cls"); return o && {key: "cls:" + d.id, prompt: `<b>${esc(d.name)}</b> จัดอยู่ในกลุ่มยาใด`, correct: d.cls, opts: o}; },
  moa(d) { const o = fieldOf(d, "moa"); return o && {key: "moa:" + d.id, prompt: `กลไกการออกฤทธิ์ของ <b>${esc(d.name)}</b> คือข้อใด`, correct: d.moa, opts: o}; },
  moa2drug(d) {
    const o = drugOptions(d, new Set(DRUGS.filter(x => x.grp === d.grp).map(x => x.id)));
    return o && {key: "moa2drug:" + d.id, prompt: `ยาใดออกฤทธิ์โดย ${esc(d.moa)}`, correct: d.name, opts: o};
  },
  use(d) { const r = tagOptions(d, "use"); return r && {key: "use:" + d.id + r.tag, prompt: `<b>${esc(d.name)}</b> ใช้รักษาภาวะใด`, correct: r.tag, opts: r.opts}; },
  use2drug(d) { const r = tag2drug(d, "use"); return r && {key: "use2drug:" + r.tag, prompt: `ยาใดใช้ใน <b>${esc(r.tag)}</b>`, correct: d.name, opts: r.opts}; },
  adr(d) { const r = tagOptions(d, "adr"); return r && {key: "adr:" + d.id + r.tag, prompt: `อาการไม่พึงประสงค์ใดสัมพันธ์กับ <b>${esc(d.name)}</b>`, correct: r.tag, opts: r.opts}; },
  adr2drug(d) { const r = tag2drug(d, "adr"); return r && {key: "adr2drug:" + r.tag, prompt: `ยาใดทำให้เกิด <b>${esc(r.tag)}</b> ได้`, correct: d.name, opts: r.opts}; },
  ci(d) { const r = tagOptions(d, "ci"); return r && {key: "ci:" + d.id + r.tag, prompt: `ข้อใดเป็นข้อห้ามใช้หรือปฏิกิริยาระหว่างยาที่สำคัญของ <b>${esc(d.name)}</b>`, correct: r.tag, opts: r.opts}; },
  ci2drug(d) { const r = tag2drug(d, "ci"); return r && {key: "ci2drug:" + r.tag, prompt: `ข้อควรระวัง <b>${esc(r.tag)}</b> เกี่ยวข้องกับยาใด`, correct: d.name, opts: r.opts}; },
  stem(d) {
    if (!d.stem) return null;
    const pool = DRUGS.filter(x => x.stem && x.grp !== d.grp);
    const xs = takeUnique(preferSame(d, pool, x => x.cat), x => x.stem.m, 3, [d.stem.m]);
    if (xs.length < 3) return null;
    const s = d.stem.s, where = s.startsWith("-") ? "ลงท้ายด้วย" : "ขึ้นต้นด้วย";
    return {key: "stem:" + d.id, prompt: `ชื่อยาที่${where} <b>${esc(s)}</b> บ่งบอกว่าเป็นยากลุ่มใด`, correct: d.stem.m,
      opts: xs.map(x => ({t: x.stem.m, ok: false, info: `${x.stem.s} → ${x.stem.m} (เช่น ${x.name})`}))};
  }
};
function makeQuestion(d, type) {
  const q = GEN[type](d);
  if (!q) return null;
  q.type = type; q.drug = d;
  const right = {t: q.correct, ok: true};
  if (type.endsWith("2drug")) right.d = d;
  q.opts = shuffle([right, ...q.opts]);
  return q;
}
function buildQuiz({cats, groups, n, ids}) {
  const pool = ids ? ids.map(i => byId[i]) : DRUGS.filter(d => cats.includes(d.cat));
  const types = GROUPS.filter(g => groups.includes(g.id)).flatMap(g => g.types);
  if (!pool.length || !types.length) return [];
  const out = [], seen = new Set();
  let order = [];
  for (let guard = 0; out.length < n && guard < n * 40; guard++) {
    if (!order.length) order = shuffle(pool);
    const d = order.pop();
    for (const t of shuffle(types)) {
      const q = makeQuestion(d, t);
      if (q && !seen.has(q.key)) { seen.add(q.key); out.push(q); break; }
    }
  }
  return out;
}

  const b = e.target.closest("button"); if (!b) return;
  if (b.hasAttribute("data-all")) S.cats = S.cats.length === CATS.length ? [] : CATS.map(c => c.id);
  else { const c = b.dataset.cat; S.cats = S.cats.includes(c) ? S.cats.filter(x => x !== c) : [...S.cats, c]; }
  renderSettings();
};
$("#grpChips").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  const g = b.dataset.grp; S.groups = S.groups.includes(g) ? S.groups.filter(x => x !== g) : [...S.groups, g];
  renderSettings();
};
$("#numChips").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.n = +b.dataset.n; renderSettings(); };
document.querySelector(".seg").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-selected", x === b));
  $("#tab-quiz").hidden = b.dataset.tab !== "quiz";
  $("#tab-lib").hidden = b.dataset.tab !== "lib";
  if (b.dataset.tab === "lib") renderLib();
};
$("#startBtn").onclick = () => startRun({cats: S.cats, groups: S.groups, n: S.n}, false);
$("#reviewBtn").onclick = () => {
  const ids = Object.keys(weak);
  startRun({ids, groups: GROUPS.map(g => g.id), n: Math.min(30, Math.max(10, ids.length * 2))}, true);
};

/* ---------- library ---------- */
let libCat = "all";
function renderLib() {
  $("#libCats").innerHTML = `<button class="chip" data-c="all" aria-pressed="${libCat === "all"}">ทั้งหมด</button>` +
    CATS.map(c => `<button class="chip" style="--c:${c.color}" data-c="${c.id}" aria-pressed="${libCat === c.id}"><span class="dot"></span>${esc(c.name)}</button>`).join("");
  const q = $("#q").value.trim().toLowerCase();
  const hit = d => !q || [d.name, d.cls, d.moa, d.pearl, d.stem && d.stem.s, ...d.yes.use, ...d.yes.adr, ...d.yes.ci].filter(Boolean).join(" ").toLowerCase().includes(q);
  let html = "";
  for (const c of CATS) {
    if (libCat !== "all" && libCat !== c.id) continue;
    const ds = DRUGS.filter(d => d.cat === c.id && hit(d));
    if (!ds.length) continue;
    html += `<h3 class="libcat" style="--c:${c.color}"><span class="dot"></span>${esc(c.name)} · ${esc(c.th)}</h3>`;
    html += ds.map(d => `<details class="drug" style="--c:${c.color}"><summary><b>${esc(d.name)}</b><span>${esc(d.cls)}</span></summary>
      <div class="info">${infoRows(d)}<div class="mini"><button class="btn ghost" data-solo="${d.id}">ทำข้อสอบเฉพาะยานี้</button></div></div></details>`).join("");
  }
  $("#libList").innerHTML = html || `<p class="empty">ไม่พบยาที่ค้นหา</p>`;
}
$("#q").oninput = renderLib;
$("#libCats").onclick = e => { const b = e.target.closest("button"); if (!b) return; libCat = b.dataset.c; renderLib(); };
$("#libList").onclick = e => {
  const b = e.target.closest("[data-solo]"); if (!b) return;
  startRun({ids: [b.dataset.solo], groups: GROUPS.map(g => g.id), n: 8}, false);
};

/* ---------- quiz run ---------- */
function startRun(cfg, review) {
  const qs = buildQuiz(cfg);
  if (!qs.length) { alertBox("ยังสร้างคำถามจากตัวเลือกนี้ไม่ได้ ลองเลือกหมวดหรือหัวข้อเพิ่ม"); return; }
  run = {cfg, review, qs, i: 0, score: 0, wrong: [], answered: false};
  show("quiz"); renderQ();
}
function alertBox(msg) { const p = document.createElement("p"); p.className = "hint"; p.style.color = "var(--bad)"; p.textContent = msg; $("#tab-quiz").appendChild(p); setTimeout(() => p.remove(), 4000); }
function renderQ() {
  const q = run.qs[run.i], c = catOf[q.drug.cat];
  run.answered = false;
  $("#progT").textContent = `ข้อ ${run.i + 1} / ${run.qs.length}`;
  $("#scoreT").textContent = `ถูก ${run.score}`;
  $("#progBar").style.width = (run.i / run.qs.length * 100) + "%";
  const qt = $("#qType"); qt.style.setProperty("--c", c.color); qt.textContent = `${TYPE_LABEL[q.type]} · ${c.name}`;
  $("#qText").innerHTML = q.prompt;
  $("#opts").innerHTML = q.opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="n">${k + 1}</span><span class="tx">${esc(o.t)}</span></button>`).join("");
  $("#fb").hidden = true; $("#fb").innerHTML = "";
  window.scrollTo(0, 0);
}
function answer(k) {
  if (run.answered) return;
  run.answered = true;
  const q = run.qs[run.i], chosen = q.opts[k], ok = chosen.ok;
  if (ok) run.score++; else run.wrong.push(q);
  // spaced review: wrong → add weight, right in review → reduce
  const id = q.drug.id;
  if (!ok) weak[id] = (weak[id] || 0) + 1;
  else if (run.review && weak[id]) { weak[id]--; if (weak[id] <= 0) delete weak[id]; }
  store.set("drugquiz-weak", weak);

  document.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    const o = q.opts[j];
    if (o.ok) b.classList.add("ok");
    else if (j === k) b.classList.add("bad");
    else b.classList.add("dim");
    if (!o.ok && j === k) {
      const sub = o.d ? o.d.cls : o.info;
      if (sub) b.querySelector(".tx").insertAdjacentHTML("beforeend", `<span class="sub">${esc(sub)}</span>`);
    }
  });
  $("#scoreT").textContent = `ถูก ${run.score}`;
  const last = run.i === run.qs.length - 1;
  const c = catOf[q.drug.cat];
  $("#fb").innerHTML = `<div class="verdict ${ok ? "ok" : "bad"}"><b>${ok ? "ถูกต้อง" : "ยังไม่ถูก"}</b>
      <button class="btn" id="nextBtn">${last ? "ดูผลคะแนน" : "ข้อต่อไป ›"}</button></div>
    <div class="fbcard" style="--c:${c.color}"><h3>${esc(q.drug.name)}<small>${esc(c.name)} · ${esc(c.th)}</small></h3>
      <div class="info">${infoRows(q.drug, FOCUS[q.type])}</div></div>`;
  $("#fb").hidden = false;
  $("#nextBtn").onclick = next;
  $("#nextBtn").focus({preventScroll: true});
}
function next() {
  if (!run.answered) return;
  if (run.i < run.qs.length - 1) { run.i++; renderQ(); } else finish();
}
function finish() {
  const n = run.qs.length, pct = Math.round(run.score / n * 100);
  $("#resBig").textContent = `${run.score} / ${n}`;
  $("#resSub").textContent = pct === 100 ? "ถูกทุกข้อ" : `ถูก ${pct}% · ตอบผิด ${run.wrong.length} ข้อ`;
  $("#redoBtn").hidden = !run.wrong.length;
  const strip = h => h.replace(/<[^>]+>/g, "");
  $("#missList").innerHTML = run.wrong.length ? `<h2 style="font-size:19px;margin:0 0 10px">ข้อที่ตอบผิด</h2>` + run.wrong.map(q =>
    `<div class="miss"><div class="q">${esc(strip(q.prompt))}</div><div class="a">${esc(q.correct)}</div></div>`).join("") : "";
  show("result");
  renderSettings();
}
$("#opts").onclick = e => { const b = e.target.closest(".opt"); if (b) answer(+b.dataset.k); };
$("#quitBtn").onclick = () => { show("home"); renderSettings(); };
$("#againBtn").onclick = () => startRun(run.cfg, run.review);
$("#redoBtn").onclick = () => {
  const ids = [...new Set(run.wrong.map(q => q.drug.id))];
  startRun({ids, groups: GROUPS.map(g => g.id), n: Math.min(30, Math.max(6, ids.length * 3))}, true);
};
$("#homeBtn").onclick = () => { show("home"); renderSettings(); };
document.addEventListener("keydown", e => {
  if ($("#quiz").hidden || e.target.tagName === "INPUT" || e.target.id === "nextBtn") return;
  if (!run.answered && /^[1-4]$/.test(e.key)) answer(+e.key - 1);
  else if (run.answered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); next(); }
});

renderSettings();
</script>
</body>
</html>
